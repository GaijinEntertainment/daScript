name: Deploy daslang.io

on:
  push:
    branches: [master]
  workflow_dispatch:

# Only one site deployment at a time
concurrency:
  group: pages-deploy
  cancel-in-progress: true

# `pages: write` and `id-token: write` are gone with actions/deploy-pages: the only
# deploy target is now the VPS over rsync, which authenticates with an SSH key.
permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # KEEP THIS, despite nothing deploying to GitHub Pages any more. The environment
    # is now purely a SECRET SCOPE: DASWEB_DEPLOY_KEY is an environment secret on
    # `github-pages` (the repository has no repo-level secrets), and the VPS deploy
    # step below treats an empty key as "fork, skip" and exits 0. Delete this block
    # and daslang.io silently stops updating while this workflow stays green.
    # Renaming the environment to something honest means re-entering the secret
    # under the new name FIRST, or the same silent break.
    environment:
      name: github-pages
    steps:
    - name: "SCM Checkout"
      uses: actions/checkout@v4

    - name: "Install Python dependencies"
      run: |
        pip install -r doc/requirements.txt
        pip install markdown

    - name: "Install CMake and Ninja"
      uses: lukka/get-cmake@latest

    # The wasm64 (MEMORY64) modules emscripten emits refuse to load under a node older than 23
    # ("This emscripten-generated code requires node v23.0.0"); ubuntu-latest ships 22, and the
    # DlimConfiguration probe below runs one of those modules under the runner's node.
    - name: "Install node 24 (the wasm64 probe runs under it)"
      uses: actions/setup-node@v4
      with:
        node-version: 24

    # The host daslang now builds with dasGlfw/dasOpenGL ON so it can drive the
    # /examples game cross-compile (daspkg release wasm). dasGlfw's
    # find_package(OpenGL REQUIRED) needs the GL + X11 dev headers.
    - name: "Install OpenGL + libc++ dev libraries"
      run: |
        # libc++ so the wasm cross-compile host can be built with the SAME C++
        # stdlib as the emscripten target (see the host build step below).
        # NO libglfw3 here: the runtime glfw for cache-hit runs is the
        # superbuild's own (modules/dasGlfw/glfw_dyn, cached below with the
        # shared modules). A system libglfw3 satisfies the libglfw.so.3 soname
        # but not the newer symbols the dasGLFW binding takes ADDRESSES of
        # (data relocs bind eagerly even under RTLD_LAZY), so dasModuleGlfw's
        # dlopen fails quietly and das2rst dies on `Unable to initialize some
        # modules: imgui_app`. Version skew is worse than absence — absence
        # at least fails loudly.
        sudo bash ci/apt_install.sh libgl1-mesa-dev libglu1-mesa-dev xorg-dev libc++-dev libc++abi-dev

    - name: Setup Emscripten
      uses: emscripten-core/setup-emsdk@v11
      with:
        # Every emsdk pin snapshots LLVM main (not a release tag). 5.0.3
        # (clang 23.0.0git, 2026-03-13 snapshot) repeatedly broke on
        # utils/gen1-to-gen2/ds_parser.cpp — bus-errors one run, EOF-
        # inside-`#ifndef` parse errors the next. We pinned to 4.0.23
        # (clang 22.0.0git, 2026-01-09 snapshot) but the same intermittent
        # parser failures still surfaced (~1 in 4 deploys); see run
        # https://github.com/GaijinEntertainment/daScript/actions/runs/26377946207.
        # 5.0.7 ships clang 23.0.0git snapshot 7b58716d96c3 — same major
        # family as the bad 5.0.3, but a different upstream snapshot.
        # Locally compiles ds_parser.cpp + the full daslang_static target
        # cleanly. Bump back down if 5.0.7 reintroduces the flake.
        version: '5.0.7'

    # Cache every expensive wasm artifact, keyed on the sources that affect it.
    # A doc-only push (doc/source, blog, news, *.md) leaves this key unchanged →
    # cache hit → the host build + wasm build steps below are skipped and the
    # cached binaries/archives are reused, so docs redeploy without rebuilding
    # the runtime, games, or compute samples. Any source change to the runtime,
    # modules, daslib, daspkg, or the example sources misses the key → full rebuild.
    # `lib` is cached with `bin` and must stay that way: bin/daslang links
    # against lib/liblibDaScriptDyn*.so, and a hit SKIPS the host build below,
    # so restoring the exe alone yields a binary that cannot start at all
    # ("error while loading shared libraries"). That combination only occurs on
    # a site-only merge — anything touching src/modules/daslib misses the key
    # and rebuilds — which is why it stayed hidden until the first one landed.
    # The browser examples' source models (GGUFs + phoneme packs from Hugging Face, ~120 MB), keyed on
    # the models.json files that name them by sha256: a deploy re-downloads only when a set changes.
    # The .dlim images are never cached - they are minted per deploy for the build it just made.
    - name: "Cache the browser examples' source models"
      uses: actions/cache@v4
      with:
        path: ~/.cache/dasllama-web-models
        key: dasllama-web-models-${{ hashFiles('examples/dasLLAMA/*/models.json') }}

    - name: "Cache wasm build artifacts"
      id: wasm-cache
      uses: actions/cache@v4
      with:
        # Shared modules are globbed, not enumerated: das2rst dlopens EVERY
        # dynamic module its doc sweep requires (stbimage via dasGLTF, pugixml,
        # hv, unit-test, ...), and an enumerated list silently drops whichever
        # one the sweep grows next. A hit restores only what the list names, the
        # native build is skipped, and das2rst dies on the first missing module
        # — reachable only on a site-only merge (anything touching src/modules/
        # daslib misses the key), the same way the lib/ omission above stayed
        # hidden. #3652 was the first such merge; this is the second member of
        # that class, so the list goes.
        # modules/dasGlfw/glfw_dyn is the superbuild's glfw install — the exact
        # .so the glfw-family shared modules were linked against, at the path
        # their rpath ($ORIGIN/glfw_dyn/Release/lib) resolves. Without it a
        # cache-hit run has no loadable glfw (third member of the class; a
        # system libglfw3 is no substitute — see the apt step above).
        path: |
          bin
          lib
          modules/**/*.shared_module
          examples/**/*.shared_module
          modules/dasGlfw/glfw_dyn
          web/output
          web/output64
          site/playground/samples
          site/playground/tutorials
        # The workflow file itself is a build input (it carries the configure flags
        # for web/build64 below), so hash it too — a change to the build steps must
        # miss a stale cache rather than skip the rebuild and reuse old archives.
        key: wasm-${{ runner.os }}-${{ hashFiles('.github/workflows/pages.yml', 'CMakeLists.txt', 'web/CMakeLists.txt', 'web/stage_playground_imgui_samples.cmake', 'src/**', 'include/**', 'modules/**', 'daslib/**', 'utils/daslang/**', 'utils/daspkg/**', 'examples/games/**', 'examples/graphics/**', 'examples/pathTracer/**', 'examples/dasLLAMA/**', 'web/examples/ui/samples/**', 'tutorials/**', 'dastest/**') }}

    # Host daslang — one games-capable build (dasLLVM for cross-compile + dasGlfw
    # + dasOpenGL shared modules for the games) that serves BOTH das2rst and the
    # wasm cross-compile. Skipped on a cache hit (the cached bin/ + shared modules
    # are restored; das2rst below still runs against them).
    - name: "Build: Daslang host (+ glfw/opengl shared modules)"
      if: steps.wasm-cache.outputs.cache-hit != 'true'
      run: |
        set -eux
        mkdir -p build
        # This is the wasm CROSS-COMPILE host: `daspkg build --wasm` below runs it
        # to JIT-codegen the .das games/samples to wasm64, baking C++ handled-type
        # layouts (Context, jobque, std::string-bearing structs) from the HOST's
        # ABI. The emscripten target is libc++ + C++ exceptions (-fwasm-exceptions
        # + DAS_ENABLE_EXCEPTIONS, see web/CMakeLists.txt); a default libstdc++ +
        # setjmp host bakes the WRONG offsets/sizes (std::string 32 vs 24, mutex 80
        # vs 40, exception state) -> wasm heap corruption. Building the host libc++
        # + exceptions makes host==target layout (verified: zero handled-type
        # divergence on every runtime-live type; only the compiler-only Program
        # residual remains).
        # /usr/bin/clang (absolute): setup-emsdk prepends its LLVM snapshot to PATH, so a
        # bare `clang` resolves to emsdk's (flaky on ds_parser.cpp, see version note above).
        # /usr/bin/clang is the runner-image clang every other Linux clang job uses
        # (build.yml, extended_checks.yml), paired with the apt libc++ installed above.
        # NB: a `#` comment inside the `\`-continued cmake call below terminates it (exit 127).
        cmake --no-warn-unused-cli -B./build \
          -DCMAKE_BUILD_TYPE:STRING=Release \
          -DCMAKE_C_COMPILER=/usr/bin/clang -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
          -DCMAKE_C_FLAGS="-DDAS_ENABLE_EXCEPTIONS=1" \
          -DCMAKE_CXX_FLAGS="-stdlib=libc++ -DDAS_ENABLE_EXCEPTIONS=1 -D_LIBCPP_DISABLE_DEPRECATION_WARNINGS" \
          -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++" \
          -DCMAKE_SHARED_LINKER_FLAGS="-stdlib=libc++" \
          -DDAS_HV_DISABLED=OFF \
          -DDAS_PUGIXML_DISABLED=OFF \
          -DDAS_LLVM_DISABLED=OFF \
          -DDAS_GLFW_DISABLED=OFF \
          -G Ninja
        cmake --build ./build --target daslang dasModuleGlfw dasModuleOpenGL

    - name: "Run das2rst"
      # DAS_TRACE_MODULE_LOAD prints every shared-module dlopen attempt with
      # its dlerror. A failed dlopen is otherwise quietly deferred (retry
      # queue) and only surfaces steps later as a cryptic `Unable to
      # initialize some modules` / `missing prerequisite` — with the trace,
      # the log names the .so and the missing symbol directly.
      env:
        DAS_TRACE_MODULE_LOAD: 1
      run: |
        set -eux
        ./bin/daslang -documentation doc/reflections/das2rst.das

    - name: "Run imgui2rst"
      # dasImgui's stdlib pages (doc/source/stdlib/generated/imgui_*.rst) come
      # from its own generator; the host above builds with dasGlfw+dasImgui ON.
      env:
        DAS_TRACE_MODULE_LOAD: 1
      run: ./bin/daslang modules/dasImgui/utils/imgui2rst.das

    - name: "Run vulkan2rst"
      # dasVulkan's stdlib pages (doc/source/stdlib/generated/vulkan_*.rst) come
      # from its own generator; it introspects the loaded boost modules via RTTI
      # and never creates a Vulkan instance, so this needs no GPU.
      env:
        DAS_TRACE_MODULE_LOAD: 1
      run: ./bin/daslang modules/dasVulkan/utils/vulkan2rst.das

    - name: "Stage tutorial recordings (docs-assets release)"
      # The `.. video::` directive fails the -W sphinx build on any recording
      # missing from _static/tutorials/, so staging must precede sphinx.
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: bash utils/internal/docs-assets/fetch.sh

    - name: "Build Sphinx HTML"
      run: |
        sphinx-build -W --keep-going -b html -d doc/sphinx-build doc/source build/site

    # WASM build: the wasm32 interpreter playground (daslang_static) + the wasm64
    # compiled path (runtime/module archives, compute samples, and the /examples
    # games). Skipped on a cache hit — the cached web/output + web/output64 are
    # reused. wasm32 is the universal interpreter fallback; everything COMPILED
    # is wasm64 (the cross-compile is layout-correct only when host ptr width ==
    # target ptr width).
    - name: "Build WASM (Emscripten): playground + wasm64 examples"
      if: steps.wasm-cache.outputs.cache-hit != 'true'
      run: |
        set -eux
        REPO="$PWD"

        # 0. The imgui-family dependents for the playground showcases (furier,
        #    path_tracer_lab): dasImgui itself is IN-TREE now; clone only
        #    dasImguiImplot + dasImguiNodeEditor into modules/ — the root modules
        #    glob absorbs their both-worlds CMakeLists (the superbuild-emscripten
        #    arm), so the playground build below compiles + statically links them
        #    from source into the threaded daslang_static and embeds their .das
        #    halves (web/CMakeLists EXISTS gates). No daspkg index or prebuilt
        #    archives involved; the wasmboy CI lane gates this exact wiring on
        #    every PR. The clones are REMOVED right after the playground build —
        #    the wasm64 daspkg release flow (steps 2+) uses the externals'
        #    STANDALONE emscripten branches and must not absorb the clones into
        #    web/build64 (in-tree dasImgui stays put; its wasm64 archives build
        #    on demand via its .das_package release_wasm_build).
        git clone --depth 1 --recurse-submodules https://github.com/borisbat/dasImguiImplot.git    modules/dasImguiImplot
        git clone --depth 1 --recurse-submodules https://github.com/borisbat/dasImguiNodeEditor.git modules/dasImguiNodeEditor

        # 1. wasm32 interpreter playground (daslang_static) + vendored UI + the example .das
        #    sources staged into site/playground. THREADED build (-pthread + the imgui family),
        #    so new_thread / JobQue map to Web Workers and every playground sample runs
        #    cross-origin-isolated (coi-serviceworker drops the memory64 gate for /playground).
        #    stage_site_playground also generates the furier + path_tracer_lab samples from the
        #    canonical examples/graphics sources. If the imgui-family build breaks (an external's
        #    master regressed), degrade rather than blocking every deploy: drop the clones and
        #    rebuild plain — only the imgui playground samples are unavailable that deploy (the
        #    same non-fatal stance as the example cards).
        build_playground() {
            ( cd web && mkdir -p build && cd build \
                && emcmake cmake -DCMAKE_BUILD_TYPE=Release -G Ninja -DDAS_WASM_PTHREADS=ON .. \
                && ninja daslang_static stage_site_playground )
        }
        if ! build_playground; then
            echo "WARNING: imgui-family playground build failed — rebuilding plain threaded daslang_static; the furier + path_tracer_lab playground samples will not run this deploy."
            rm -rf modules/dasImguiImplot modules/dasImguiNodeEditor web/build
            build_playground
        fi
        rm -rf modules/dasImguiImplot modules/dasImguiNodeEditor

        # 2. wasm64 archives for the example games. Configure web/build64 with
        #    the prebuilt host (so the game builds reuse it instead of
        #    rebuilding daslang) + memory64; daspkg build --wasm then populates the
        #    runtime/module archives into it.
        #    This step exists only to serve the game builds below. When those move
        #    onto the build queue, it leaves CI with them.
        #    DAS_WASM_PTHREADS=ON: daspkg `release wasm` now ALWAYS links -pthread
        #    (--shared-memory), so the module archives it links (dasGlfw/dasOpenGL/...)
        #    MUST be compiled with +atomics,+bulk-memory or wasm-ld rejects the link
        #    ("--shared-memory is disallowed by dasGLFW.cpp.o"). cmd_build_wasm only
        #    self-configures threads when build64 has no cache yet, but we pre-create
        #    the cache here (for the host override), so set the flag explicitly.
        emcmake cmake -S web -B web/build64 -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DDAS_WEB_OUTPUT_DIR="$REPO/web/output64" \
          -DDAS_WASM_MEMORY64=ON \
          -DDAS_WASM_PTHREADS=ON \
          -DCMAKE_CXX_FLAGS=-sMEMORY64=1 -DCMAKE_C_FLAGS=-sMEMORY64=1 \
          -DDAS_HOST_DASLANG_OVERRIDE="$REPO/bin/daslang"
        ./bin/daslang utils/daspkg/main.das -- build --wasm

        # 3. /examples games → standalone wasm64 web apps (web/output64/examples/<g>/).
        #    Non-fatal per game: a game's wasm build must never red the whole deploy
        #    (which would take the playground + the other example cards down with it).
        #    The staging step degrades a missing game wasm to its interpreted fallback.
        for g in arcanoid pacman boulder-dash river_run; do
            if ./bin/daslang utils/daspkg/main.das -- \
                 release wasm --root "examples/games/$g" --out "$REPO/web/output64/examples"; then
                echo "$g wasm build OK"
            else
                echo "WARNING: $g wasm build failed — its card falls back to interpreted this deploy."
            fi
        done

        # 4. /examples furier — the ImGui-in-wasm showcase. dasImgui is in-tree;
        #    `release wasm` discovers it from the compiled require chain and
        #    drives its .das_package release_wasm_build to produce the 3 wasm64
        #    archives on demand — no daspkg install step (the example declares
        #    no deps). Non-fatal — a wasm-build hiccup must not red the whole
        #    deploy; the furier card is skipped at stage time below (examples.js
        #    shows a "needs memory64" note when the iframe is unavailable).
        if ./bin/daslang utils/daspkg/main.das -- \
                release wasm --root examples/graphics/furier --out "$REPO/web/output64/examples"; then
            echo "furier wasm build OK"
        else
            echo "WARNING: furier wasm build failed — its examples card will be skipped this deploy."
        fi

        # 5. /examples path_tracer_lab — the jobque + OpenGL showcase. Same in-tree
        #    dasImgui require as furier; the threaded daspkg wasm pipeline (always
        #    -pthread, see step 2) maps its new_thread / JobQue modes to real Web
        #    Workers. Non-fatal for the same reason as furier; staged below only when
        #    all three outputs are present. The page serves it cross-origin-isolated
        #    via coi-serviceworker.js (required for the -pthread module to instantiate).
        if ./bin/daslang utils/daspkg/main.das -- \
                release wasm --root examples/graphics/path_tracer_lab --out "$REPO/web/output64/examples"; then
            echo "path_tracer_lab wasm build OK"
        else
            echo "WARNING: path_tracer_lab wasm build failed — its examples card will be skipped this deploy."
        fi

        # 6. /examples physarum_lab — the threads + audio showcase. Same in-tree dasImgui require
        #    as the path tracer; the threaded daspkg wasm
        #    pipeline maps its worker threads to Web Workers, and the daspkg wasm link's AudioWorklet
        #    flags carry the strudel soundtrack. Non-fatal; staged below only when all three outputs
        #    are present. Served cross-origin-isolated (coi-serviceworker.js).
        if ./bin/daslang utils/daspkg/main.das -- \
                release wasm --root examples/graphics/physarum_lab --out "$REPO/web/output64/examples"; then
            echo "physarum_lab wasm build OK"
        else
            echo "WARNING: physarum_lab wasm build failed — its examples card will be skipped this deploy."
        fi

        # 7. dasllama.io/examples — dasLLAMA itself compiled to wasm64, one app per example
        #    (storyteller: stories15M writes, KittenTTS reads; storywish: you type the words,
        #    tinystories-instruct-27M writes, Pocket TTS reads). Each .das_package turns the GPU modules off, so the
        #    host needs no Metal/Vulkan. Non-fatal like the games; the dasllama.io stage step
        #    stages a card's page only when all three outputs exist. The models are prepared .dlim
        #    images the stage step MINTS for this very build: examples/dasLLAMA/wasm/dlim_config is
        #    the same wasm64 build's DlimConfiguration probe, run under node here so the stage step
        #    bakes against the identity the browser build actually wants (a set minted for another
        #    IMAGE_VERSION is declined by the program - the failure that put a black canvas on the
        #    storyteller page for a day).
        for ex in storyteller storywish; do
            if ./bin/daslang utils/daspkg/main.das -- \
                    release wasm --root "examples/dasLLAMA/$ex" --out "$REPO/web/output64/examples"; then
                echo "$ex wasm build OK"
            else
                echo "WARNING: $ex wasm build failed — the dasllama.io $ex page will be a placeholder this deploy."
            fi
        done
        if ./bin/daslang utils/daspkg/main.das -- \
                release wasm --root examples/dasLLAMA/wasm/dlim_config --out "$REPO/web/output64/examples" \
           && ( cd web/output64/examples/dlim_config && node dlim_config.js > wasm64.json ) \
           && grep -q '"backend"' web/output64/examples/dlim_config/wasm64.json; then
            echo "wasm64 DlimConfiguration probe OK: $(tr -d ' \n' < web/output64/examples/dlim_config/wasm64.json | cut -c1-120)..."
        else
            # fatal, unlike an example's own build: without the probe no set can be minted, so a
            # deploy that went on would replace two working pages with placeholders; a red job
            # leaves the previous deploy live
            rm -f web/output64/examples/dlim_config/wasm64.json
            echo "::error::the wasm64 DlimConfiguration probe failed - no model set can be minted for either dasllama.io example; the deploy stops here so the previous pages stay up"
            exit 1
        fi

    - name: "Compile-gate the curated playground samples"
      # The per-sample wasm64 builds used to live here and doubled as the proof
      # that every curated sample still compiles. They now build on demand
      # through the build queue, so this gate keeps that proof without
      # producing anything: -dry-run compiles and
      # simulates each sample and writes nothing. A sample broken by a compiler
      # or daslib change must red this deploy, not the production queue, where
      # the first person to click Run would find it.
      run: |
        set -eu
        FAILED=""
        for f in web/examples/ui/samples/examples/*.das web/examples/ui/samples/examples/*/main.das; do
            ./bin/daslang -dry-run "$f" > /tmp/gate.log 2>&1 || {
                FAILED="$FAILED ${f#web/examples/ui/samples/examples/}"
                echo "--- $f ---"; tail -20 /tmp/gate.log
            }
        done
        if [ -n "$FAILED" ]; then
            echo "::error::curated playground sample(s) no longer compile:$FAILED"
            exit 1
        fi
        echo "all curated samples compile"

    - name: "Verify wasm example artifacts (catch silent fallbacks)"
      # The example builds above are non-fatal (one run surfaces EVERY failure
      # instead of dying on the first), and the staging step degrades a missing
      # build to a placeholder / interpreted fallback — so without this the deploy
      # goes GREEN with broken cards and you only notice on the live site. Fail
      # here if any card that is supposed to compile to wasm64 didn't produce its
      # artifact. A card meant to ship interpreted-only simply isn't listed.
      # Always runs (no cache gate), so a partial cached state is caught too.
      run: |
        set -eu
        MISSING=""
        for f in \
            web/output/daslang_static.wasm \
            web/output64/examples/arcanoid/arcanoid.wasm \
            web/output64/examples/pacman/pacman.wasm \
            web/output64/examples/boulder-dash/boulder-dash.wasm \
            web/output64/examples/river_run/river_run.wasm \
            web/output64/examples/furier/furier.wasm \
            web/output64/examples/path_tracer_lab/path_tracer_lab.wasm \
            web/output64/examples/physarum_lab/physarum_lab.wasm; do
            [ -f "$f" ] || MISSING="$MISSING $f"
        done
        if [ -n "$MISSING" ]; then
            echo "::error::expected wasm artifacts missing — a card fell back to placeholder/interpreted:$MISSING"
            exit 1
        fi
        echo "all expected wasm artifacts present"

    - name: "Fetch dasProfile per-platform benchmark JSONs"
      # dasProfile now ships a per-platform JSON file
      # (profile_results_<platform>.json). forge.js's bench cycler fetches
      # each one and renders a platform-list rail. Missing-platform files
      # don't abort the build — the cycler silently drops them client-side.
      run: |
        set -eux
        for plat in darwin linux windows; do
            curl -fsSL -o "site/files/profile_results_${plat}.json" \
                "https://raw.githubusercontent.com/borisbat/dasProfile/main/profile_results_${plat}.json" \
              || { rm -f "site/files/profile_results_${plat}.json"; echo "WARNING: missing profile_results_${plat}.json"; }
        done
      continue-on-error: true

    - name: "Stage site for deployment"
      run: |
        set -eux
        mkdir -p _site

        # Static landing page and assets
        cp site/index.html _site/
        cp site/downloads.html _site/
        cp site/daspkg.html _site/
        cp site/examples.html _site/
        cp site/dasllama.html _site/
        cp site/performance.html _site/
        cp site/benchmarks.html _site/
        cp site/robots.txt _site/
        cp site/sitemap.xml _site/
        cp site/google2cfdec88941bbdfc.html _site/   # Search Console ownership token — must stay deployed
        cp -r site/files _site/files

        # Cross-origin isolation worker — must sit at site root so its scope (/) can
        # control the root-level /examples.html navigation. It only rewrites headers
        # under /examples* and /playground* (the threaded -pthread wasm subtrees);
        # every other page passes through untouched. See site/coi-serviceworker.js.
        cp site/coi-serviceworker.js _site/coi-serviceworker.js

        # Freshly-built Sphinx HTML docs
        cp -r build/site _site/doc

        # Blog + news + changelist (regenerated each publish). Pin --site-url
        # explicitly so feed.xml entries point at the production domain even
        # if the default in build_blog.py drifts.
        python3 site/blog/build_blog.py \
            --posts site/blog/_posts \
            --news site/_news \
            --template site/blog/template.html \
            --site-url https://daslang.io \
            --out _site/

        # Playground: vendor web/ui IDE + WASM artifacts.
        # The WASM build step now fails the workflow (no continue-on-error),
        # so under normal master deploys we always take the if-branch. The
        # else-branch survives as defense-in-depth — if the artifacts ever
        # go missing despite a green build, we stage a placeholder rather
        # than 404'ing the route (the VPS deploy rsyncs _site with --delete, so
        # each release is a complete snapshot with no layering over the prior one).
        if [ -f web/output/daslang_static.js ] && [ -f web/output/daslang_static.wasm ]; then
            mkdir -p _site/playground _site/files/wasm
            # Copy IDE source files (CodeMirror, jQuery, main.js/css, etc.)
            cp -r web/examples/ui/src/* _site/playground/
            # Copy WASM artifacts — known-present after the guard above.
            cp web/output/daslang_static.js _site/playground/
            cp web/output/daslang_static.wasm _site/playground/
            cp web/output/daslang_static.js _site/files/wasm/
            cp web/output/daslang_static.wasm _site/files/wasm/
            # Pull samples from site/playground/samples — that directory is the
            # single staged source of truth: stage_site_playground populates
            # the .das sources. No .wasm overlay: the playground's wasm engine
            # fetches built artifacts from the build service by content hash,
            # so there is nothing per-sample to ship with the site.
            cp -r site/playground/samples _site/playground/samples 2>/dev/null || true
            # Tutorial assets (mesh + PBR textures + HDRI) fetched at runtime by
            # samples that ship a .das.assets.json manifest (the OpenGL
            # deferred-shading rung). stage_site_playground staged them under
            # site/playground/tutorials/_assets; the manifest names them at the
            # repo-relative path tutorials/_assets/..., so preserve that layout.
            # Without this the manifest 200s but every asset fetch 404s — so make
            # a missing dir loud (warn) rather than silently shipping a broken
            # rung; an actual copy failure fails the step under set -eo pipefail.
            if [ -d site/playground/tutorials ]; then
                cp -r site/playground/tutorials _site/playground/tutorials
            else
                echo "WARNING: site/playground/tutorials missing — manifest-driven samples (e.g. the OpenGL deferred rung) will 404 their assets."
            fi
            # Our Forge-skinned playground/index.html + skin CSS + init shim take precedence.
            # CodeMirror bundle (codemirror.min.js/css, simple-mode.js, daslang-*.js,
            # cm-forge.css) is served from /files/cm/ — copied via `cp -r site/files`
            # earlier, so nothing extra to copy here.
            # Every page under site/playground, not just index.html: run-frame.html
            # is the host each program runs in, and a playground missing it has a
            # permanently disabled Run button (the runner never reports ready).
            # It shipped absent once because the copy list named index.html and
            # globbed only the .js — glob the .html too, so a new page lands.
            cp site/playground/*.html _site/playground/
            cp site/playground/index.html _site/playground/index.html
            cp site/playground/forge-skin.css _site/playground/
            # Forge playground scripts (init shim + tabs + share + splitter).
            # Glob so future playground-*.js additions land automatically.
            cp site/playground/playground-*.js _site/playground/
        else
            # WASM artifacts missing. The VPS deploy rsyncs _site with --delete,
            # so each release is a complete snapshot (no layering over the prior
            # one) and an absent _site/playground/ would 404 the route. Stage a
            # placeholder instead — the URL keeps resolving to something
            # useful while we re-roll the runtime.
            echo "WARNING: daslang_static.{js,wasm} missing under web/output — staging placeholder /playground/."
            mkdir -p _site/playground
            cp site/playground/placeholder.html _site/playground/index.html
        fi

        # /examples/ runtime: the interpreted runner harness + per-game artifacts.
        # Each game dir holds BOTH the compiled wasm64 build (loaded in an iframe on
        # memory64 engines) AND the .das sources + HUD font the interpreted fallback
        # (_interp.html) mounts on Safari/iOS. The page UI (examples.html, posters,
        # files/examples.js) was already staged above via cp site/examples.html +
        # cp -r site/files.
        mkdir -p _site/examples
        cp site/examples/_interp.html _site/examples/_interp.html
        for g in arcanoid pacman boulder-dash river_run; do
            mkdir -p "_site/examples/$g"
            if [ -f "web/output64/examples/$g/$g.wasm" ]; then
                cp "web/output64/examples/$g/$g.html" "_site/examples/$g/"
                cp "web/output64/examples/$g/$g.js"   "_site/examples/$g/"
                cp "web/output64/examples/$g/$g.wasm" "_site/examples/$g/"
            else
                echo "WARNING: web/output64/examples/$g/$g.wasm missing — $g card will fall back to interpreted only."
            fi
            # Interpreted-fallback sources + HUD font (fetched by _interp.html;
            # the whole bundle — _interp.html's GAME_FILES mirrors data.json's list).
            cp web/examples/ui/samples/examples/"$g"/*.das "_site/examples/$g/"
            rm -f "_site/examples/$g"/test_*.das   # dastest suites are repo-side, not deploy payload
            cp modules/dasStbImage/fonts/droidsansmono.ttf "_site/examples/$g/"
        done

        # furier — the ImGui-in-wasm showcase. wasm64-only: it bundles the compiled
        # dasImgui module, which the universal interpreter can't bind, so there is NO
        # interpreted fallback (no .das sources to stage). The card is always listed
        # in examples.js, so stage the compiled build only when ALL THREE outputs are
        # present; otherwise stage a small placeholder furier.html so a memory64 engine
        # loads a friendly "being rebuilt" note instead of 404-ing the iframe (and
        # flipping the player to a bogus "running" on the 404 page's load event).
        mkdir -p _site/examples/furier
        if [ -f web/output64/examples/furier/furier.html ] \
           && [ -f web/output64/examples/furier/furier.js ] \
           && [ -f web/output64/examples/furier/furier.wasm ]; then
            cp web/output64/examples/furier/furier.html _site/examples/furier/
            cp web/output64/examples/furier/furier.js   _site/examples/furier/
            cp web/output64/examples/furier/furier.wasm _site/examples/furier/
        else
            echo "WARNING: furier wasm build incomplete — staging a placeholder so the always-listed card doesn't 404."
            printf '%s' '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Fourier Series — building</title><style>html,body{margin:0;height:100%}body{background:#0d0c0a;color:#cfc8bb;font-family:ui-monospace,Menlo,Consolas,monospace;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}p{max-width:30rem;line-height:1.6}</style></head><body><p>This example is being rebuilt and will be available shortly.</p></body></html>' > _site/examples/furier/furier.html
        fi

        # path_tracer_lab — the jobque + OpenGL showcase. Same wasm64-only / external
        # dasImgui story as furier (no interpreted fallback): stage the compiled build
        # only when all three outputs are present, else a "being rebuilt" placeholder so
        # the always-listed card never 404s its iframe.
        mkdir -p _site/examples/path_tracer_lab
        if [ -f web/output64/examples/path_tracer_lab/path_tracer_lab.html ] \
           && [ -f web/output64/examples/path_tracer_lab/path_tracer_lab.js ] \
           && [ -f web/output64/examples/path_tracer_lab/path_tracer_lab.wasm ]; then
            cp web/output64/examples/path_tracer_lab/path_tracer_lab.html _site/examples/path_tracer_lab/
            cp web/output64/examples/path_tracer_lab/path_tracer_lab.js   _site/examples/path_tracer_lab/
            cp web/output64/examples/path_tracer_lab/path_tracer_lab.wasm _site/examples/path_tracer_lab/
        else
            echo "WARNING: path_tracer_lab wasm build incomplete — staging a placeholder so the always-listed card doesn't 404."
            printf '%s' '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Path Tracer Lab — building</title><style>html,body{margin:0;height:100%}body{background:#0d0c0a;color:#cfc8bb;font-family:ui-monospace,Menlo,Consolas,monospace;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}p{max-width:30rem;line-height:1.6}</style></head><body><p>This example is being rebuilt and will be available shortly.</p></body></html>' > _site/examples/path_tracer_lab/path_tracer_lab.html
        fi

        # physarum_lab — the threads + audio showcase. Same wasm64-only / in-tree dasImgui story as
        # the path tracer (no interpreted fallback in the iframe): stage the compiled build only when
        # all three outputs are present, else a "being rebuilt" placeholder so the card never 404s.
        mkdir -p _site/examples/physarum_lab
        if [ -f web/output64/examples/physarum_lab/physarum_lab.html ] \
           && [ -f web/output64/examples/physarum_lab/physarum_lab.js ] \
           && [ -f web/output64/examples/physarum_lab/physarum_lab.wasm ]; then
            cp web/output64/examples/physarum_lab/physarum_lab.html _site/examples/physarum_lab/
            cp web/output64/examples/physarum_lab/physarum_lab.js   _site/examples/physarum_lab/
            cp web/output64/examples/physarum_lab/physarum_lab.wasm _site/examples/physarum_lab/
        else
            echo "WARNING: physarum_lab wasm build incomplete — staging a placeholder so the always-listed card doesn't 404."
            printf '%s' '<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Physarum Lab — building</title><style>html,body{margin:0;height:100%}body{background:#0d0c0a;color:#cfc8bb;font-family:ui-monospace,Menlo,Consolas,monospace;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}p{max-width:30rem;line-height:1.6}</style></head><body><p>This example is being rebuilt and will be available shortly.</p></body></html>' > _site/examples/physarum_lab/physarum_lab.html
        fi

    - name: "Stage dasllama.io for deployment"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # gh release download of the browser examples' model sets
      run: |
        set -eux
        mkdir -p _site_dasllama/files

        # Regenerate the news board + feed + sitemap from _news/. The generated
        # copies are checked in (the preview rig serves the tree directly), but the
        # deploy regenerates anyway so a forgotten local run cannot ship stale news.
        python3 site-dasllama/build_news.py --root site-dasllama
        python3 site-dasllama/test_metadata.py

        cp site-dasllama/index.html _site_dasllama/
        cp site-dasllama/examples.html _site_dasllama/
        cp site-dasllama/stories.html _site_dasllama/

        # The browser examples: the wasm64 build from step 7 above plus its model set, MINTED
        # HERE for that build. examples/dasLLAMA/<ex>/models.json names each source file on Hugging
        # Face (borisbat/dasllama-stories, borisbat/dasllama-tts) with its sha256;
        # examples/dasLLAMA/wasm/mint_models.py fetches them (cached by sha256 across deploys),
        # bakes each GGUF into a .dlim against the wasm64 build's own DlimConfiguration (the
        # step-7 probe), copies the packs, writes models/manifest.json (the file list + the
        # IMAGE_VERSION the images carry) and stamps that version into the page, which refuses a
        # set minted for another version before it fetches one. --expect-image-version is the
        # gate: an image whose header disagrees with the tree's IMAGE_VERSION (mint_models.py
        # exits 3) REDS THIS DEPLOY - that is this tree's converter minting a version this tree's
        # loader does not read, never a transient. Served same-origin, so the page needs no CORS;
        # the Caddy vhost adds the isolation headers under /examples/ (caddy.snippet). A missing
        # build or probe, or a set that would not fetch or mint, stages a placeholder page under a
        # warning annotation, so the card never 404s.
        IMAGE_VERSION=$(sed -n 's/^let IMAGE_VERSION = \([0-9][0-9]*\).*/\1/p' modules/dasLLAMA/dasllama/dasllama_image.das)
        test -n "$IMAGE_VERSION"
        placeholder_page() {
            echo "::warning title=dasllama.io $1::$2 - staging a placeholder so the card doesn't 404"
            rm -rf "_site_dasllama/examples/$1/models"
            printf '%s' "<!doctype html><html lang=\"en\"><head><meta charset=\"utf-8\"><title>$1 - building</title><style>html,body{margin:0;height:100%}body{background:#12101a;color:#d6cfbf;font-family:ui-monospace,Menlo,Consolas,monospace;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}p{max-width:30rem;line-height:1.6}</style></head><body><p>This example is being rebuilt and will be available shortly.</p></body></html>" > "_site_dasllama/examples/$1/$1.html"
        }
        for ex in storyteller storywish; do
            mkdir -p "_site_dasllama/examples/$ex"
            if [ -f "web/output64/examples/$ex/$ex.html" ] \
               && [ -f "web/output64/examples/$ex/$ex.js" ] \
               && [ -f "web/output64/examples/$ex/$ex.wasm" ] \
               && [ -s web/output64/examples/dlim_config/wasm64.json ]; then
                cp "web/output64/examples/$ex/$ex.html" "_site_dasllama/examples/$ex/"
                rc=0
                python3 examples/dasLLAMA/wasm/mint_models.py \
                    --example "examples/dasLLAMA/$ex" \
                    --config web/output64/examples/dlim_config/wasm64.json \
                    --daslang ./bin/daslang \
                    --out "_site_dasllama/examples/$ex/models" \
                    --cache "$HOME/.cache/dasllama-web-models" \
                    --expect-image-version "$IMAGE_VERSION" \
                    --stamp-page "_site_dasllama/examples/$ex/$ex.html" || rc=$?
                if [ "$rc" -eq 3 ]; then
                    echo "::error title=dasllama.io $ex::the images minted for $ex do not carry the tree's IMAGE_VERSION $IMAGE_VERSION - this tree's converter and loader disagree"
                    exit 1
                elif [ "$rc" -ne 0 ]; then
                    placeholder_page "$ex" "the model set did not fetch or mint (exit $rc)"
                else
                    cp "web/output64/examples/$ex/$ex.js"   "_site_dasllama/examples/$ex/"
                    cp "web/output64/examples/$ex/$ex.wasm" "_site_dasllama/examples/$ex/"
                fi
            else
                placeholder_page "$ex" "the wasm build or the DlimConfiguration probe is missing"
            fi
        done
        mkdir -p _site_dasllama/stories
        cp -R site-dasllama/stories/. _site_dasllama/stories/
        cp site-dasllama/ladder.html _site_dasllama/
        cp site-dasllama/sidecars.html _site_dasllama/
        cp site-dasllama/robots.txt _site_dasllama/
        cp site-dasllama/sitemap.xml _site_dasllama/
        cp site-dasllama/feed.xml _site_dasllama/
        # -R: files/ now carries subdirectories (files/fonts/); a bare * would fail on them
        cp -R site-dasllama/files/. _site_dasllama/files/

        # Shared visual language, staged from the daslang.io tree — single source
        # in the repo, mirrored by site-dasllama/serve.py for local preview.
        for f in forge.css nav-dropdown.css dasllama-table.css github-star.js; do
            cp "site/files/$f" "_site_dasllama/files/$f"
        done

    - name: "Deploy to daslang.io origin (VPS)"
      # master-only, in the workflow itself. This guard used to sit on the Pages step
      # ("so a workflow_dispatch from a branch cannot touch the production site") and
      # went with it; without it the sole thing standing between a branch dispatch and
      # production is the `github-pages` environment's branch policy — a setting in the
      # GitHub UI that this repository cannot see or review. Broaden that policy for any
      # reason and unreviewed content ships. Cheap to state here, so state it here.
      if: github.ref == 'refs/heads/master'
      # The ONLY deploy target. Caddy serves the box directly; there is no Jekyll
      # in the path, so the old _site/.nojekyll marker went with the Pages steps.
      # Release layout on the box: /srv/daslang.io/releases/<rNNN-sha>, with
      # `current` an atomic symlink Caddy serves; --link-dest hard-links files
      # unchanged since the previous release so a docs-only deploy costs ~MBs.
      env:
        DEPLOY_KEY: ${{ secrets.DASWEB_DEPLOY_KEY }}
      run: |
        set -euo pipefail
        # A fork has no access to the secret and legitimately skips. The canonical
        # repo does not: this is now the ONLY deploy target, so an empty key there
        # means the site silently stops updating while the workflow reports success
        # — which is exactly how a missing DASWEB_DEPLOY_KEY would hide. Fail loudly.
        if [ -z "$DEPLOY_KEY" ]; then
            if [ "$GITHUB_REPOSITORY" = "GaijinEntertainment/daScript" ]; then
                echo "::error::DASWEB_DEPLOY_KEY is empty on the canonical repo - nothing was deployed."
                echo "It is an ENVIRONMENT secret on the 'github-pages' environment; check that the job still declares it."
                exit 1
            fi
            echo "DASWEB_DEPLOY_KEY not set (fork) - skipping VPS deploy"
            exit 0
        fi
        mkdir -p ~/.ssh
        printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/dasweb_deploy
        chmod 600 ~/.ssh/dasweb_deploy
        # Pinned host key - no trust-on-first-use from CI.
        echo '89.167.63.131 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILP2wzOeEGD2r7apldQlTe2gwR1dVTCXCfrD+pJooMmY' >> ~/.ssh/known_hosts
        RSH="ssh -i $HOME/.ssh/dasweb_deploy -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes"
        REL="r${{ github.run_number }}-$(echo "$GITHUB_SHA" | cut -c1-8)"
        # Hard-link against the previous release when there is one. rsync only
        # warns on a missing --link-dest, but skipping it keeps the log honest
        # on a fresh/rebuilt box.
        LINK=""
        if $RSH deploy@89.167.63.131 "test -d /srv/daslang.io/current/"; then
            LINK="--link-dest=/srv/daslang.io/current/"
        fi
        rsync -az --delete $LINK \
            -e "$RSH" _site/ "deploy@89.167.63.131:/srv/daslang.io/releases/$REL/"
        # Atomic flip, then prune to the 5 newest releases.
        $RSH deploy@89.167.63.131 "ln -sfn /srv/daslang.io/releases/$REL /srv/daslang.io/current \
            && cd /srv/daslang.io/releases && ls -1t | tail -n +6 | xargs -r rm -rf"
        # The curated dropdown is fed from dasweb-playground's store, which imports the tree
        # daslang.io's deploy just replaced. Runs HERE, before the dasllama.io block, so a
        # dasllama.io failure cannot skip it and leave the playground serving stale samples.
        # Loopback-only endpoint; a non-zero here must not fail the site deploy.
        $RSH deploy@89.167.63.131 \
            "curl -sf -m 30 -X POST http://127.0.0.1:8101/admin/reimport || echo 'reimport nudge failed (service down?)'"
        # dasllama.io rides the same box and key, same release layout. Its Caddy vhost may still
        # mirror daslang.io until the flip — staging releases before the flip is harmless.
        # mkdir -p first: rsync only creates the LAST path component, so the releases parent
        # must exist on the first-ever deploy.
        $RSH deploy@89.167.63.131 "mkdir -p /srv/dasllama.io/releases"
        DLINK=""
        if $RSH deploy@89.167.63.131 "test -d /srv/dasllama.io/current/"; then
            DLINK="--link-dest=/srv/dasllama.io/current/"
        fi
        rsync -az --delete $DLINK \
            -e "$RSH" _site_dasllama/ "deploy@89.167.63.131:/srv/dasllama.io/releases/$REL/"
        $RSH deploy@89.167.63.131 "ln -sfn /srv/dasllama.io/releases/$REL /srv/dasllama.io/current \
            && cd /srv/dasllama.io/releases && ls -1t | tail -n +6 | xargs -r rm -rf"
        # The ladder renders from the exchange service's DB, not from the pages just shipped;
        # its official boards are the record stores in the repo, so a merged store refresh
        # must reach the service or the live board silently stays at its last hand-seed.
        # Same shape as the playground nudge: loopback-only endpoint, upsert-on-identity
        # (re-imports are idempotent), a miss must not fail the site deploy. Store filter
        # mirrors the service's own official_dir import: records/<box>.json single-dot names
        # only - tune sidecars, annotations.json and _scratch are not stores.
        for store in modules/dasLLAMA/performance/records/*.json; do
            name=$(basename "$store")
            case "$name" in
                *.*.*|annotations.json|_*) continue ;;
            esac
            $RSH deploy@89.167.63.131 \
                "curl -sf -m 60 -X POST -H 'Content-Type: application/json' --data-binary @- http://127.0.0.1:8201/admin/import-official" \
                < "$store" && echo "imported $name" \
                || echo "ladder import of $name failed (service down?)"
        done
        echo "deployed $REL"
