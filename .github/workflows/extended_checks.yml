name: extended checks

on:
  push:
    branches: [master]
  pull_request:
  # 04:00 UTC — after build.yml (02:00), the daspkg index (02:30) and imgui (03:00).
  # The nightly is what SEEDS the sccache slots below. Their save is master-only,
  # but the master PUSH run is usually skipped by pre_job as a concurrent duplicate
  # of the PR that just merged (4 of 15 recent merges actually ran), so seeding was
  # left to chance. A cron run is on master, has no concurrent twin, and lands the
  # slot every night. It also hosts the checks too slow to sit on every PR,
  # and the whole windows lane (nightly-only, uncached — see the matrix).
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
defaults:
  run:
    shell: bash

concurrency:
  # event_name is part of the group so the nightly cron gets a lane of its own.
  # Without it a merge landing mid-cron shares the master `github.ref` group and
  # cancel-in-progress kills the cron — which then skips itself as a duplicate,
  # so the sccache seeding the cron exists to do silently never happens.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:

  ###########################################################
  pre_job:
  ###########################################################
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'same_content'
          do_not_skip: '["pull_request", "workflow_dispatch"]'

  ###########################################################
  extended_checks:
  ###########################################################
    needs: pre_job
    # Same shape as build.yml: the nightly cron bypasses pre_job (and runs only on
    # the canonical repo, so forks don't), everything else keeps the duplicate-skip.
    if: >-
      (github.event_name == 'schedule' && github.repository == 'GaijinEntertainment/daScript')
      || (github.event_name != 'schedule' && needs.pre_job.outputs.should_skip != 'true')
    runs-on: ${{ matrix.runner }}
    # actions: write needed for `gh cache delete` in the sccache refresh step.
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      # The windows lane runs on the nightly cron and manual dispatch only —
      # retired from the per-PR path: it re-runs the same shared das surface
      # MSVC-slower while adding no windows-only checks (build.yml's windows
      # cells are the per-PR MSVC gate), and it runs uncached by design (see
      # the sccache comment below). The event ternary appears on BOTH the
      # target axis and the include list: an include whose target is absent
      # from the axis would be ADDED as a standalone cell, not dropped.
      matrix:
        target: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('["linux", "darwin15", "windows"]') || fromJSON('["linux", "darwin15"]') }}
        architecture: [64, arm64]

        include: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && fromJSON('[{"target":"linux","runner":"ubuntu-latest","build_system":"cmake","cmake_generator":"Ninja"},{"target":"darwin15","architecture":"arm64","runner":"macos-15","architecture_string":"arm64","build_system":"cmake","cmake_generator":"Ninja"},{"target":"windows","runner":"windows-latest","build_system":"cmake","cmake_generator":"Ninja","architecture_string":"x64"}]') || fromJSON('[{"target":"linux","runner":"ubuntu-latest","build_system":"cmake","cmake_generator":"Ninja"},{"target":"darwin15","architecture":"arm64","runner":"macos-15","architecture_string":"arm64","build_system":"cmake","cmake_generator":"Ninja"}]') }}

        exclude:
          - target: linux
            architecture: arm64
          - target: windows
            architecture: arm64
          - target: darwin15
            architecture: 64

    steps:
    - name: "SCM Checkout"
      uses: actions/checkout@v4
      with:
        # Full history so the lint step can `git diff` against the PR base branch.
        fetch-depth: 0

    - name: "Exclude workspace from Windows Defender"
      if: runner.os == 'Windows'
      shell: pwsh
      continue-on-error: true
      # Defender real-time scan of freshly-written .obj/.exe/.dll slows the build
      # and can momentarily lock a just-linked exe (the "Access is denied" deploy
      # race). Exclude the workspace + toolchain writers and try to disable RTP;
      # the status dump records whether the runner image actually honored it
      # (managed Defender / Tamper Protection may silently no-op).
      # continue-on-error: a managed-Defender runner must not fail CI.
      run: |
        Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue
        foreach ($p in 'daslang.exe','daslang_static.exe','test_aot.exe','cl.exe','link.exe','lld-link.exe','mt.exe','vctip.exe','mspdbsrv.exe','vcpkg.exe') {
          Add-MpPreference -ExclusionProcess $p -ErrorAction SilentlyContinue
        }
        Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
        Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, IsTamperProtected
        Get-MpPreference | Select-Object -ExpandProperty ExclusionPath

    - name: "Install CMake and Ninja"
      uses: lukka/get-cmake@latest

    - if: runner.os == 'Windows'
      uses: ilammy/setup-nasm@v1

    - if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: "Install: Required Dev Packages"
      run: |
        set -eux
        case "${{ matrix.target }}" in
          darwin15)
            brew install bison openssl
            echo 'export PATH="/usr/local/opt/bison/bin:$PATH"' >> ~/.bash_profile
            export LDFLAGS="-L/usr/local/opt/bison/lib -L$(brew --prefix openssl)/lib"
            export CPPFLAGS="-I$(brew --prefix openssl)/include"
            ;;
          linux)
            echo "MARCH=64" >> $GITHUB_ENV
            # apt.llvm.org provides LLVM 22 packages for Noble (not yet in main archive).
            wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
              | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/llvm.gpg
            echo 'deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' \
              | sudo tee /etc/apt/sources.list.d/llvm.list
            sudo apt-get update -y
            sudo apt-get install --no-install-recommends -y \
              mesa-common-dev \
              libglu1-mesa-dev \
              libgl1-mesa-dev \
              libglfw3-dev \
              libx11-dev \
              libxrandr-dev \
              libxcursor-dev \
              libxinerama-dev \
              libxi-dev \
              llvm-22-dev
            ;;
        esac

    # RESTORE-ONLY on purpose. build.yml owns this key and seeds it on master;
    # a plain actions/cache here would also SAVE, and a save from a PR is scoped
    # to refs/pull/N/merge — invisible to every sibling PR. That is what actually
    # happened: 6 cache entries for 2 keys, all PR-scoped, ~836MB of quota, and
    # every Windows job still missing and rebuilding openssl (8.5 min a run).
    # Not on the cron: nightlies consume no cache, so the scheduled windows lane
    # builds openssl from source (~8 min, budgeted). Dispatch still restores.
    - name: "Restore vcpkg + openssl"
      if: runner.os == 'Windows' && github.event_name != 'schedule'
      uses: actions/cache/restore@v4
      with:
        # vcpkg.exe + ports/triplets/scripts + installed/<triplet>/openssl.
        path: vcpkg
        key: vcpkg-x64-windows-v2

    - name: "Install openssl (Windows)"
      if: runner.os == 'Windows'
      run: |
        if [ ! -x vcpkg/vcpkg.exe ] && [ ! -x vcpkg/vcpkg ]; then
            git clone https://github.com/microsoft/vcpkg && ./vcpkg/bootstrap-vcpkg.sh
        fi
        ./vcpkg/vcpkg install openssl:x64-windows --binarycaching
        echo "VCPKG_ROOT=$(pwd)/vcpkg" >> $GITHUB_ENV
        # Drop build intermediates so the saved cache holds only installed/ — ~1.2GiB -> ~0.1GiB.
        rm -rf vcpkg/buildtrees vcpkg/downloads vcpkg/packages

    # sccache with LOCAL-DISK backend, wrapped in ONE actions/cache entry per
    # matrix config — mirrors build.yml. The GHA backend writes one cache item
    # per TU (quota fragmentation, frequent concurrent-write failures); local
    # disk keeps all objects in $SCCACHE_DIR persisted as a single tarball.
    # Linux + darwin only: the windows lane is nightly-only and nightlies run
    # UNCACHED by policy (they are not a show-stopper; a windows /Z7 object
    # slot alone would be ~5-6GB of quota serving one un-waited-on run a day).
    - uses: mozilla-actions/sccache-action@v0.0.10
      if: matrix.target != 'windows'
    - if: matrix.target != 'windows'
      run: |
        echo "SCCACHE_DIR=${{ runner.temp }}/sccache" >> $GITHUB_ENV
        echo "SCCACHE_GHA_ENABLED=false" >> $GITHUB_ENV
        # The launcher exported via env also wraps the GLFW/libhv
        # ExternalProject sub-builds — harmless on gcc/clang.
        # SCCACHE_CACHE_SIZE bounds the slot: the default is 10G, so an unbounded
        # slot grows until it evicts other caches in the repository. 500M holds a
        # full linux/macOS object set with room — build.yml's linux Release slot
        # sits at ~94MB.
        echo "SCCACHE_CACHE_SIZE=500M" >> $GITHUB_ENV
        echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
        echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
    # Stable per-config key in its own `sccache-extended-*` namespace so it never
    # clobbers build.yml's slots. PRs restore read-only; save only on master
    # (delete first — GHA caches are immutable, so a plain save under an existing
    # key is a no-op). The nightly cron is what makes the save reliable (the
    # master PUSH run is usually skipped as a concurrent duplicate), and it does
    # NOT restore — nightlies consume no cache; a cold build still saves a
    # complete fresh object set for the PR lanes to warm from.
    - name: "Restore sccache objects"
      if: matrix.target != 'windows' && github.event_name != 'schedule'
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/sccache
        key: sccache-extended-${{ matrix.target }}-${{ matrix.architecture }}

    - name: "Build: Daslang (Release)"
      run: |
        set -eux
        ACTIVE_MODULES=$(grep -v "^#" ci/release_modules.txt | cut -d':' -f2 | sed 's|^|-D|' | xargs)
        case "${{ matrix.target }}" in
          windows)
            # Ninja single-config: binaries land in ./bin (not ./bin/Release);
            # cl.exe is on PATH via the msvc-dev-cmd step; OpenSSL comes from
            # vcpkg so dasHV skips its perl+nmake source build.
            echo "BIN=./bin" >> $GITHUB_ENV
            export PATH="/c/Strawberry/perl/bin:$PATH"
            # No sccache launcher: this lane is nightly-only and runs uncached.
            cmake --no-warn-unused-cli -B./build -G "${{ matrix.cmake_generator }}" -DCMAKE_BUILD_TYPE:STRING=Release \
              $ACTIVE_MODULES -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
            cmake --build ./build --config Release --target daslang gen1_to_gen2 daslang_static --parallel
            ;;
          linux)
            echo "BIN=./bin" >> $GITHUB_ENV
            # dasClangBind stays OFF here — its libclang.so pulls in
            # libLLVM-22.so.1 which collides with dasLLVM's own use of
            # the same .so (shared LLVM pass registry → double init,
            # breaks dasbind_example JIT-to-exe). dasClangBind is built
            # and self-binder-checked on the mingw worker (build.yml)
            # where it links against msys2's libclang and there is no
            # dasLLVM in the same process.
            CC=clang CXX=clang++ cmake --no-warn-unused-cli -B./build \
              -DCMAKE_BUILD_TYPE:STRING=Release \
              -DCMAKE_OSX_ARCHITECTURES="${{ matrix.architecture_string }}" \
              -DDAS_CLANG_BIND_DISABLED=ON \
              -DDAS_GLFW_DISABLED=OFF \
              -G "${{ matrix.cmake_generator }}" $ACTIVE_MODULES
            cmake --build ./build --config Release --target daslang daslang_static
            ;;
          *)
            echo "BIN=./bin" >> $GITHUB_ENV
            CC=clang CXX=clang++ cmake --no-warn-unused-cli -B./build \
              -DCMAKE_BUILD_TYPE:STRING=Release \
              -DCMAKE_OSX_ARCHITECTURES="${{ matrix.architecture_string }}" \
              -DDAS_GLFW_DISABLED=OFF \
              -G "${{ matrix.cmake_generator }}" $ACTIVE_MODULES
            cmake --build ./build --config Release --target daslang daslang_static
            ;;
        esac

    - name: "Refresh sccache slot"
      if: matrix.target != 'windows' && github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ github.token }}
        SCKEY: sccache-extended-${{ matrix.target }}-${{ matrix.architecture }}
      run: gh cache delete "$SCKEY" -R ${{ github.repository }} || true
    - name: "Save sccache objects"
      if: matrix.target != 'windows' && github.ref == 'refs/heads/master'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/sccache
        key: sccache-extended-${{ matrix.target }}-${{ matrix.architecture }}

    - name: "Install ast-grep"
      run: npm install -g @ast-grep/cli

    - name: "Run dasgen and check generated files are up to date"
      run: cmake --build ./build --config Release --target check_dasgen

    - name: "Run examples from modules"
      run: cmake --build ./build --config Release --target run_examples

    - name: "Run utils tests"
      run: cmake --build ./build --config Release --target run_utils_tests

    - name: "Run tutorial dry-runs"
      run: cmake --build ./build --config Release --target dry_run_tutorials

    - name: "Verify authored-doc code blocks (nightly only)"
      # doc-verify compiles every das code block of the authored RST corpus
      # (skills/doc_sweep.md). Nightly-only per policy: doc rot is not a
      # per-PR gate. Skipped on windows: the checker spawns one daslang per
      # page via popen and is exercised on the posix cells.
      if: (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && matrix.target != 'windows'
      run: $BIN/daslang ./utils/doc-verify/main.das -- --daslang $BIN/daslang

    - name: "Build standalone executables"
      run: |
        set -eux
        cmake --build ./build --config Release --target all_utils_exe
        $BIN/daslang -exe -output ./bin/das-fmt ./utils/das-fmt/dasfmt.das
        $BIN/daslang -exe -output ./bin/das-lint ./utils/lint/main.das

    - name: "Sequence release smoke test"
      # Full daspkg install -> release -> launch cycle on the in-tree sequence
      # game. Exercises release_include_dll + the loader fixes (Windows
      # LoadLibraryEx, POSIX rpath $ORIGIN / @loader_path) end-to-end.
      # Lives in extended_checks (not build.yml) because sequence transitively
      # requires dasHV, which is DAS_HV_DISABLED=ON by default and only flipped
      # ON via ci/release_modules.txt in this workflow.
      run: |
        set -eux
        # The main extended_checks build only targets daslang/gen1_to_gen2/daslang_static.
        # Sequence loads dasGlfw + dasLiveHost + dasHV + dasAudio + dasPUGIXML +
        # dasStbImage at runtime; build their dynamic-module targets first.
        # No `cmake --install` -- the source tree already IS a usable daslang
        # root after build (bin/daslang via EXECUTABLE_OUTPUT_PATH; modules/<X>/
        # .shared_module via ADD_DAS_SHARED_MODULE_LIB output dirs; utils/daspkg
        # lives in the source tree). cmake --install would also try to install
        # daslang-live which extended_checks doesn't build.
        cmake --build ./build --config Release --target \
          dasModuleGlfw dasModuleLiveHost dasModuleHV dasModuleAudio \
          dasModulePUGIXML dasModuleStbImage --parallel
        case "${{ matrix.target }}" in
          windows)
            pwsh examples/games/sequence/ci_smoke_test.ps1 "$(pwd)"
            ;;
          linux)
            sudo apt-get install -y xvfb
            xvfb-run -a bash examples/games/sequence/ci_smoke_test.sh "$(pwd)"
            ;;
          *)
            bash examples/games/sequence/ci_smoke_test.sh "$(pwd)"
            ;;
        esac

    - name: "Run formatter"
      run: |
        set -eux
        cmake --build ./build --config Release --target check_format
        $BIN/das-fmt.exe --path ./ --verify

    - name: "Run lint on changed .das files"
      if: matrix.target == 'linux'
      run: |
        set -eux
        BASE_REF="${{ github.event.pull_request.base.ref }}"
        BASE_REF="${BASE_REF:-master}"
        mapfile -t CHANGED < <(git diff --name-only --diff-filter=AM "origin/${BASE_REF}...HEAD" -- '*.das')
        if [ ${#CHANGED[@]} -eq 0 ]; then
          echo "no .das files changed; skipping lint"
          exit 0
        fi
        echo "linting: ${CHANGED[*]}"
        $BIN/daslang ./utils/lint/main.das -- "${CHANGED[@]}" --quiet
        $BIN/das-lint.exe "${CHANGED[@]}" --quiet

    - name: "Run ast-verify on changed .das files"
      if: matrix.target == 'linux'
      run: |
        set -eux
        BASE_REF="${{ github.event.pull_request.base.ref }}"
        BASE_REF="${BASE_REF:-master}"
        mapfile -t CHANGED < <(git diff --name-only --diff-filter=AM "origin/${BASE_REF}...HEAD" -- '*.das')
        # canary: macro-PRODUCED AST is only verified where a macro expands, and the tree-wide
        # sweep is nightly-only - so the heaviest qmacro consumer verifies on every PR
        CHANGED+=("tests/linq/test_linq_fold.das")
        rc=0
        for f in "${CHANGED[@]}"; do
          case "$(basename "$f")" in
            cant_*|failed_*|invalid_*) continue ;;   # negative tests compile-fail by design
          esac
          # -dry-run: compile and simulate, never execute. Only an `AST verify` line is a failure;
          # a compile error here belongs to whatever gate owns that file.
          if $BIN/daslang -dry-run --ast-verify "$f" 2>&1 | grep -F "AST verify"; then
            echo "ast-verify reported on $f"
            rc=1
          fi
        done
        exit $rc

    - name: "Test daslang_static"
      run: |
        set -eux
        $BIN/daslang_static _dasroot_/dastest/dastest.das -- --color --failures-only --test ./tests
    - name: "Test ser/deser"
      run: |
        $BIN/daslang _dasroot_/dastest/dastest.das -- --color --failures-only --test ./tests --ser serialized.bin
        $BIN/daslang _dasroot_/dastest/dastest.das -- --color --failures-only --test ./tests --deser serialized.bin

    - name: "Compile tests/ with --ast-verify"
      # NIGHTLY ONLY (cron or manual dispatch), because of what it costs: 22.7 min,
      # a third of this job, and it moved the whole PR pipeline from ~57 min to
      # ~75 min the day it landed. The cost is structural — it launches one daslang
      # per test file (~1487 of them at ~3.6s each) and every process re-parses
      # daslib from scratch. dastest compiles AND RUNS the same 1703 files in a
      # single process in 2.3 min.
      # Nightly is the right cadence for what it catches: malformed AST out of
      # macro code, which lands in daslib/ and macro-authoring changes, not in the
      # average PR. On demand: gh workflow run extended_checks.yml
      if: matrix.target == 'linux' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      run: |
        set -euo pipefail
        # daslib/ast_verify reports AST shapes the compiler dereferences unguarded.
        # A compile error is fine here (many tests assert one); only an "AST verify"
        # line is a failure. Files dastest itself treats as expected-failures
        # (cant_ / failed_ / invalid_) legitimately trip it, so they are skipped.
        cat > /tmp/ast_verify_one.sh <<'EOS'
        #!/bin/bash
        f="$1"
        case "$(basename "$f")" in cant_*|failed_*|invalid_*) exit 0 ;; esac
        out=$(timeout 120 "$BIN/daslang" --ast-verify -compile-only "$f" 2>&1 || true)
        if grep -q 'AST verify' <<< "$out"; then
          echo "### $f"
          grep 'AST verify' <<< "$out" | sort -u | head -5
          exit 1
        fi
        EOS
        chmod +x /tmp/ast_verify_one.sh
        export BIN
        find ./tests -name '*.das' -print0 \
          | xargs -0 -P "$(nproc)" -n 1 /tmp/ast_verify_one.sh

    - name: "Test MCP tools"
      if: matrix.target == 'linux'
      run: |
        set -eux
        $BIN/daslang _dasroot_/dastest/dastest.das -- --color --failures-only --test ./utils/mcp/test_tools.das
        $BIN/daslang _dasroot_/dastest/dastest.das -- --color --failures-only --test ./utils/mcp/test_crosstree_guard.das

    - name: "Test LSP cross-tree guard (python)"
      if: matrix.target == 'linux'
      run: |
        set -eux
        python3 utils/lsp/test_crosstree_guard.py

    - name: "Test dasllama-server"
      # OpenAI-compatible server conformance test. Model-gated + JIT-only, so it
      # skips cleanly here (no GGUF, no -jit) — the value is the compile guard:
      # it exercises the dasHV + dasAudio + dasllama facade surface the server
      # reaches, catching any API/module breakage in CI. The exchange-client
      # suite is model-free and runs fully (fake exchange on 127.0.0.1:18131).
      if: matrix.target == 'linux'
      run: |
        set -eux
        $BIN/daslang _dasroot_/dastest/dastest.das -- --color --failures-only --test ./utils/dasllama-server/test_openai_server.das
        $BIN/daslang _dasroot_/dastest/dastest.das -- --color --failures-only --test ./utils/dasllama-server/test_openai_server_think.das
        $BIN/daslang _dasroot_/dastest/dastest.das -- --color --failures-only --test ./utils/dasllama-server/test_exchange_client.das

    - name: "Test env-knob registries"
      # The [EnvConfig] enforcement tests (daslib/env_registry scanners): raw-read
      # ban, declaration coverage, generated-ENVIRONMENT.md drift. Model-free,
      # sub-second — this lane is what makes each CODEREVIEW's "the registry test
      # enforces it" sentence true.
      if: matrix.target == 'linux'
      run: |
        set -eux
        $BIN/daslang _dasroot_/dastest/dastest.das -- --color --failures-only --test ./modules/dasLLAMA/tests/test_env_registry.das
        $BIN/daslang _dasroot_/dastest/dastest.das -- --color --failures-only --test ./modules/dasLLVM/tests/llvm_env_registry.das

    - name: "Test dasweb-playground"
      # The daslang.io sample-store backend. Its suites live in-dir (a
      # hyphenated directory requires siblings by bare name), so `--test
      # ./tests` never reaches them — without this step the store, importer,
      # config and HTTP tests run only by hand. The server suites bind
      # 127.0.0.1:19011/19012/19013 and shut themselves down.
      if: matrix.target == 'linux'
      run: |
        set -eux
        for suite in test_samples_store test_curated_import test_playground_config test_playground_server test_build_queue test_build_artifacts test_build_endpoints; do
          $BIN/daslang _dasroot_/dastest/dastest.das -- --color --failures-only --test ./utils/dasweb-playground/$suite.das
        done

    - name: "Test dasllama-ladder"
      # The dasllama.io exchange service (sidecars + ladder records). In-dir
      # suites like the playground's; the server suite binds 127.0.0.1:19015
      # and shuts itself down, the store/config suites run against :memory:.
      if: matrix.target == 'linux'
      run: |
        set -eux
        for suite in test_ladder_store test_ladder_config test_ladder_server; do
          $BIN/daslang _dasroot_/dastest/dastest.das -- --color --failures-only --test ./utils/dasllama-ladder/$suite.das
        done

    - name: "Test dasweb-buildd"
      # The wasm build worker (compute-box side of the same pipeline). In-dir
      # suites like the playground's; the client suite runs a stub playground
      # on 127.0.0.1:19014 and shuts itself down.
      if: matrix.target == 'linux'
      run: |
        set -eux
        for suite in test_buildd_config test_buildd_core test_buildd_client; do
          $BIN/daslang _dasroot_/dastest/dastest.das -- --color --failures-only --test ./utils/dasweb-buildd/$suite.das
        done

    - name: "Test dasweb-verify (curated sample compile check)"
      # Tier 1 of the sample verifier: compile+simulate every sample the
      # playground manifest ships, in process, with the binary just built.
      # Seconds of work, and it is the only gate that catches sample rot
      # (a require breaking, a manifest entry pointing at a moved file)
      # before the site serves it. The browser leg against the live site is
      # a nightly (nightly_playground.yml), not a per-PR check.
      if: matrix.target == 'linux'
      run: |
        set -eux
        $BIN/daslang _dasroot_/dastest/dastest.das -- --color --failures-only --test ./utils/dasweb-verify/test_verify_core.das
        $BIN/daslang ./utils/dasweb-verify/main.das

    # Self-binders for dasClangBind + dasLLVM bindings live on the mingw
    # worker (build.yml build_windows_mingw) — see comment on the linux
    # build step above for why dasClangBind can't be enabled here.

    # dasImgui is in-tree (modules/dasImgui) and builds in this lane like any
    # other default-ON module — the old `daspkg install dasImgui` externals-
    # coupling gate is gone. Its self-binder freshness check (bind_imgui.das)
    # lives on the mingw nightly worker beside bind_clangbind.das — cbind/
    # libclang is unavailable here (libclang.so → libLLVM collision with
    # dasLLVM, see the build-step comment above).

    - name: "Compile CI-only das surface (ci_only_das.txt)"
      # Compile-only sweep of the das surface no default local build compiles:
      # dasOpenGL's GLFW-gated files and the imgui-consuming tools
      # (jobque-timeline, the dasHerd UI root). Single source of truth with the
      # local mirror: utils/preflight's ci-das gate reads the same list file.
      run: |
        set -eux
        $BIN/daslang utils/preflight/main.das -- --only ci-das

    - name: "Coverage"
      if: matrix.target == 'linux'
      run: |
        $BIN/daslang dastest/dastest.das -- --cov-path coverage.lcov --color --test ./tests/language --timeout 1800
        $BIN/dascov.exe -- coverage.lcov --exclude tests/language

