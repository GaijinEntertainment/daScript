name: extended checks

on:
  push:
    branches: [master]
  pull_request:
  # 04:00 UTC — after build.yml (02:00), the daspkg index (02:30) and imgui (03:00).
  # The nightly is what SEEDS the sccache slots below. Their save is master-only,
  # but the master PUSH run is usually skipped by pre_job as a concurrent duplicate
  # of the PR that just merged (4 of 15 recent merges actually ran), so seeding was
  # left to chance. A cron run is on master, has no concurrent twin, and lands the
  # slot every night. It also hosts the checks too slow to sit on every PR,
  # and the whole windows lane (nightly-only, uncached — see the matrix).
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
defaults:
  run:
    shell: bash

concurrency:
  # event_name is part of the group so the nightly cron gets a lane of its own.
  # Without it a merge landing mid-cron shares the master `github.ref` group and
  # cancel-in-progress kills the cron — which then skips itself as a duplicate,
  # so the sccache seeding the cron exists to do silently never happens.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:

  ###########################################################
  pre_job:
  ###########################################################
    runs-on: ubuntu-latest
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'same_content'
          do_not_skip: '["pull_request", "workflow_dispatch"]'
      # The job matrix is data in ci/ci_matrix.py, evaluated per event here (ci/test_ci_matrix.py pins it).
      - uses: actions/checkout@v4
        with:
          sparse-checkout: ci
      - id: matrix
        # two statements: a substitution inside echo would hide the script's exit code
        run: |
          set -eu
          matrix=$(python3 ci/ci_matrix.py extended '${{ github.event_name }}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  ###########################################################
  extended_checks:
  ###########################################################
    needs: pre_job
    # Same shape as build.yml: the nightly cron bypasses pre_job (and runs only on
    # the canonical repo, so forks don't), everything else keeps the duplicate-skip.
    if: >-
      (github.event_name == 'schedule' && github.repository == 'GaijinEntertainment/daScript')
      || (github.event_name != 'schedule' && needs.pre_job.outputs.should_skip != 'true')
    name: "extended_checks (${{ matrix.target }}, ${{ matrix.role }})"
    runs-on: ${{ matrix.runner }}
    # actions: write needed for `gh cache delete` in the sccache refresh step.
    permissions:
      contents: read
      actions: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.pre_job.outputs.matrix) }}

    steps:
    - name: "SCM Checkout"
      uses: actions/checkout@v4
      with:
        # Full history so the lint step can `git diff` against the PR base branch.
        fetch-depth: 0

    - name: "Exclude workspace from Windows Defender"
      if: runner.os == 'Windows'
      shell: pwsh
      continue-on-error: true
      # Defender real-time scan of freshly-written .obj/.exe/.dll slows the build
      # and can momentarily lock a just-linked exe (the "Access is denied" deploy
      # race). Exclude the workspace + toolchain writers and try to disable RTP;
      # the status dump records whether the runner image actually honored it
      # (managed Defender / Tamper Protection may silently no-op).
      # continue-on-error: a managed-Defender runner must not fail CI.
      run: |
        Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue
        foreach ($p in 'daslang.exe','daslang_static.exe','test_aot.exe','cl.exe','link.exe','lld-link.exe','mt.exe','vctip.exe','mspdbsrv.exe','vcpkg.exe') {
          Add-MpPreference -ExclusionProcess $p -ErrorAction SilentlyContinue
        }
        Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
        Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, IsTamperProtected
        Get-MpPreference | Select-Object -ExpandProperty ExclusionPath

    - name: "Install CMake and Ninja"
      uses: lukka/get-cmake@latest

    - if: runner.os == 'Windows'
      uses: ilammy/setup-nasm@v1

    - if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: "Install: Required Dev Packages"
      run: |
        set -eux
        case "${{ matrix.target }}" in
          darwin15)
            brew install bison openssl
            echo 'export PATH="/usr/local/opt/bison/bin:$PATH"' >> ~/.bash_profile
            export LDFLAGS="-L/usr/local/opt/bison/lib -L$(brew --prefix openssl)/lib"
            export CPPFLAGS="-I$(brew --prefix openssl)/include"
            ;;
          linux)
            echo "MARCH=64" >> $GITHUB_ENV
            # apt.llvm.org provides LLVM 22 packages for Noble (not yet in main archive).
            wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
              | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/llvm.gpg
            echo 'deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main' \
              | sudo tee /etc/apt/sources.list.d/llvm.list
            sudo bash ci/apt_install.sh --no-install-recommends \
              mesa-common-dev \
              libglu1-mesa-dev \
              libgl1-mesa-dev \
              libglfw3-dev \
              libx11-dev \
              libdbus-1-dev \
              libxrandr-dev \
              libxcursor-dev \
              libxinerama-dev \
              libxi-dev \
              llvm-22-dev \
              xvfb
            ;;
        esac

    # RESTORE-ONLY on purpose. build.yml owns this key and seeds it on master;
    # a plain actions/cache here would also SAVE, and a save from a PR is scoped
    # to refs/pull/N/merge — invisible to every sibling PR. That is what actually
    # happened: 6 cache entries for 2 keys, all PR-scoped, ~836MB of quota, and
    # every Windows job still missing and rebuilding openssl (8.5 min a run).
    # Not on the cron: nightlies consume no cache, so the scheduled windows lane
    # builds openssl from source (~8 min, budgeted). Dispatch still restores.
    - name: "Restore vcpkg + openssl"
      if: runner.os == 'Windows' && github.event_name != 'schedule'
      uses: actions/cache/restore@v4
      with:
        # vcpkg.exe + ports/triplets/scripts + installed/<triplet>/openssl.
        path: vcpkg
        key: vcpkg-x64-windows-v2

    - name: "Install openssl (Windows)"
      if: runner.os == 'Windows'
      run: |
        if [ ! -x vcpkg/vcpkg.exe ] && [ ! -x vcpkg/vcpkg ]; then
            git clone https://github.com/microsoft/vcpkg && ./vcpkg/bootstrap-vcpkg.sh
        fi
        ./vcpkg/vcpkg install openssl:x64-windows --binarycaching
        echo "VCPKG_ROOT=$(pwd)/vcpkg" >> $GITHUB_ENV
        # Drop build intermediates so the saved cache holds only installed/ — ~1.2GiB -> ~0.1GiB.
        rm -rf vcpkg/buildtrees vcpkg/downloads vcpkg/packages

    # sccache with LOCAL-DISK backend, wrapped in ONE actions/cache entry per
    # matrix config — mirrors build.yml. The GHA backend writes one cache item
    # per TU (quota fragmentation, frequent concurrent-write failures); local
    # disk keeps all objects in $SCCACHE_DIR persisted as a single tarball.
    # Linux + darwin only: the windows lane is nightly-only and nightlies run
    # UNCACHED by policy (they are not a show-stopper; a windows /Z7 object
    # slot alone would be ~5-6GB of quota serving one un-waited-on run a day).
    - uses: mozilla-actions/sccache-action@v0.0.10
      if: matrix.target != 'windows'
    - if: matrix.target != 'windows'
      run: |
        echo "SCCACHE_DIR=${{ runner.temp }}/sccache" >> $GITHUB_ENV
        echo "SCCACHE_GHA_ENABLED=false" >> $GITHUB_ENV
        # The launcher exported via env also wraps the GLFW/libhv
        # ExternalProject sub-builds — harmless on gcc/clang.
        # SCCACHE_CACHE_SIZE bounds the slot: the default is 10G, so an unbounded
        # slot grows until it evicts other caches in the repository. A Release
        # build of daslang + daslang_static + the sequence smoke's module targets
        # is ~800MB of objects; 1500M holds all of it, so the nightly save lands
        # a complete set and a PR lane's build is a cache read.
        echo "SCCACHE_CACHE_SIZE=1500M" >> $GITHUB_ENV
        echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
        echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
    # Stable per-config key in its own `sccache-extended-*` namespace so it never
    # clobbers build.yml's slots. PRs restore read-only; save only on master
    # (delete first — GHA caches are immutable, so a plain save under an existing
    # key is a no-op). The nightly cron is what makes the save reliable (the
    # master PUSH run is usually skipped as a concurrent duplicate), and it does
    # NOT restore — nightlies consume no cache; a cold build still saves a
    # complete fresh object set for the PR lanes to warm from.
    - name: "Restore sccache objects"
      if: matrix.target != 'windows' && github.event_name != 'schedule'
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/sccache
        key: sccache-extended-${{ matrix.target }}-${{ matrix.architecture }}

    - name: "Build: Daslang (Release)"
      run: |
        set -eux
        ACTIVE_MODULES=$(grep -v "^#" ci/release_modules.txt | cut -d':' -f2 | sed 's|^|-D|' | xargs)
        case "${{ matrix.target }}" in
          windows)
            # Ninja single-config: binaries land in ./bin (not ./bin/Release);
            # cl.exe is on PATH via the msvc-dev-cmd step; OpenSSL comes from
            # vcpkg so dasHV skips its perl+nmake source build.
            echo "BIN=./bin" >> $GITHUB_ENV
            export PATH="/c/Strawberry/perl/bin:$PATH"
            # No sccache launcher: this lane is nightly-only and runs uncached.
            cmake --no-warn-unused-cli -B./build -G "${{ matrix.cmake_generator }}" -DCMAKE_BUILD_TYPE:STRING=Release \
              $ACTIVE_MODULES -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
            cmake --build ./build --config Release --target daslang daslang_static dasbind_probe --parallel
            ;;
          linux)
            echo "BIN=./bin" >> $GITHUB_ENV
            # dasClangBind stays OFF here — its libclang.so pulls in
            # libLLVM-22.so.1 which collides with dasLLVM's own use of
            # the same .so (shared LLVM pass registry → double init,
            # breaks dasbind_example JIT-to-exe). dasClangBind is built
            # and self-binder-checked on the mingw worker (build.yml)
            # where it links against msys2's libclang and there is no
            # dasLLVM in the same process.
            CC=clang CXX=clang++ cmake --no-warn-unused-cli -B./build \
              -DCMAKE_BUILD_TYPE:STRING=Release \
              -DCMAKE_OSX_ARCHITECTURES="${{ matrix.architecture_string }}" \
              -DDAS_CLANG_BIND_DISABLED=ON \
              -DDAS_GLFW_DISABLED=OFF \
              -G "${{ matrix.cmake_generator }}" $ACTIVE_MODULES
            cmake --build ./build --config Release --target daslang daslang_static dasbind_probe
            ;;
          *)
            echo "BIN=./bin" >> $GITHUB_ENV
            CC=clang CXX=clang++ cmake --no-warn-unused-cli -B./build \
              -DCMAKE_BUILD_TYPE:STRING=Release \
              -DCMAKE_OSX_ARCHITECTURES="${{ matrix.architecture_string }}" \
              -DDAS_GLFW_DISABLED=OFF \
              -G "${{ matrix.cmake_generator }}" $ACTIVE_MODULES
            cmake --build ./build --config Release --target daslang daslang_static dasbind_probe
            ;;
        esac

    - name: "Refresh sccache slot"
      if: matrix.target != 'windows' && matrix.role != 'modules' && github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ github.token }}
        SCKEY: sccache-extended-${{ matrix.target }}-${{ matrix.architecture }}
      run: gh cache delete "$SCKEY" -R ${{ github.repository }} || true
    - name: "Save sccache objects"
      if: matrix.target != 'windows' && matrix.role != 'modules' && github.ref == 'refs/heads/master'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/sccache
        key: sccache-extended-${{ matrix.target }}-${{ matrix.architecture }}

    - name: "Install python packages"
      run: |
        set -eux
        python3 -m pip install -r ci/requirements.txt \
          || python3 -m pip install --user -r ci/requirements.txt \
          || python3 -m pip install --break-system-packages -r ci/requirements.txt

    - name: "Install ast-grep and the tree-sitter CLI"
      # tree-sitter-cli, pinned to the version that generated tree-sitter-daslang/src (a newer
      # generator rewrites parser.c): tree-sitter-daslang/REVIEW.das regenerates and diffs it
      run: npm install -g @ast-grep/cli tree-sitter-cli@0.26.8

    - name: "Extended checks"
      run: cmake --build ./build --config Release --target run_extended_${{ matrix.role }}

  nightly_issue:
    needs: [pre_job, extended_checks]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    uses: ./.github/workflows/nightly_issue.yml
    with:
      lane: extended_checks.yml
