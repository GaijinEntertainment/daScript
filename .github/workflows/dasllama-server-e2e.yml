name: dasllama-server control page e2e

# Needs no model, no JIT, no server binary — the page runs against captured
# fixtures; regeneration rail: utils/dasllama-server/tests/fixtures/README.md.

on:
  pull_request:
    paths:
      - 'utils/dasllama-server/control.html'
      - 'utils/dasllama-server/tests/**'
      - '.github/workflows/dasllama-server-e2e.yml'
  push:
    branches-ignore: [master]
    paths:
      - 'utils/dasllama-server/control.html'
      - 'utils/dasllama-server/tests/**'
      - '.github/workflows/dasllama-server-e2e.yml'
  workflow_dispatch:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: utils/dasllama-server/tests/package-lock.json

      - name: "Install Playwright"
        working-directory: utils/dasllama-server/tests
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: "Run tests"
        working-directory: utils/dasllama-server/tests
        run: npx playwright test

      - name: "Upload Playwright report on failure"
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: utils/dasllama-server/tests/playwright-report/
          retention-days: 7
