name: Build doc

# Run only on tags and release publish
on:
  release:
    types: prereleased
  push:
    paths:
      - 'doc/**'
      - 'daslib/**'
      - 'src/builtin/**'
      - 'modules/dasLLAMA/dasllama/**'
      - 'modules/dasImgui/**'
      - 'modules/dasVulkan/**'
      - 'modules/dasAudio/audio/**'
      - 'modules/dasAudio/strudel/**'
      - 'modules/dasGLTF/gltf/**'
      - 'modules/dasHV/dashv/**'
      - 'modules/dasOPENAI/openai/**'
      - 'modules/dasPEG/peg/**'
      - 'modules/dasPUGIXML/pugixml/**'
      - 'modules/dasSpirv/spirv/**'
      - 'modules/dasStbImage/stbimage/**'
  pull_request:
    paths:
      - 'doc/**'
      - 'daslib/**'
      - 'src/builtin/**'
      - 'modules/dasLLAMA/dasllama/**'
      - 'modules/dasImgui/**'
      - 'modules/dasVulkan/**'
      - 'modules/dasAudio/audio/**'
      - 'modules/dasAudio/strudel/**'
      - 'modules/dasGLTF/gltf/**'
      - 'modules/dasHV/dashv/**'
      - 'modules/dasOPENAI/openai/**'
      - 'modules/dasPEG/peg/**'
      - 'modules/dasPUGIXML/pugixml/**'
      - 'modules/dasSpirv/spirv/**'
      - 'modules/dasStbImage/stbimage/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: "SCM Checkout"
      uses: actions/checkout@v4
    - name: "Install Python dependencies"
      run: |
        # Our bindings do not work on latest.
        pip install -r doc/requirements.txt

    - name: "Install CMake and Ninja"
      uses: lukka/get-cmake@latest

    # GL/X11 dev headers: the doc host now builds with dasGlfw + dasImgui ON so
    # imgui2rst can load the imgui modules and generate the GUI stdlib pages.
    - name: "Install GL + X11 dev libraries"
      run: |
        sudo bash ci/apt_install.sh --no-install-recommends \
          mesa-common-dev libglu1-mesa-dev libgl1-mesa-dev libglfw3-dev \
          libx11-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev

    - name: "Build: Daslang (for das2rst + imgui2rst + vulkan2rst)"
      run: |
        set -eux
        mkdir build
        cmake --no-warn-unused-cli -B./build \
          -DCMAKE_BUILD_TYPE:STRING=Release \
          -DDAS_HV_DISABLED=OFF \
          -DDAS_PUGIXML_DISABLED=OFF \
          -DDAS_LLVM_DISABLED=ON \
          -DDAS_GLFW_DISABLED=OFF \
          -DDAS_VULKAN_DISABLED=OFF \
          -DDAS_BUILD_DOCUMENTATION=ON \
          -G Ninja
        cmake --build ./build --target daslang

    - name: "Doc lane"
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: cmake --build ./build --target run_doc
