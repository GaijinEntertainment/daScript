name: Build doc

# Run only on tags and release publish
on:
  release:
    types: prereleased
  push:
    paths:
      - 'doc/**'
      - 'daslib/**'
      - 'src/builtin/**'
      - 'modules/dasLLAMA/dasllama/**'
      - 'modules/dasImgui/**'
      - 'modules/dasVulkan/**'
  pull_request:
    paths:
      - 'doc/**'
      - 'daslib/**'
      - 'src/builtin/**'
      - 'modules/dasLLAMA/dasllama/**'
      - 'modules/dasImgui/**'
      - 'modules/dasVulkan/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: "SCM Checkout"
      uses: actions/checkout@v4
    - name: "Install Python dependencies"
      run: |
        # Our bindings do not work on latest.
        pip install -r doc/requirements.txt

    - name: "Install CMake and Ninja"
      uses: lukka/get-cmake@latest

    # GL/X11 dev headers: the doc host now builds with dasGlfw + dasImgui ON so
    # imgui2rst can load the imgui modules and generate the GUI stdlib pages.
    - name: "Install GL + X11 dev libraries"
      run: |
        sudo apt-get update
        sudo apt-get install --no-install-recommends -y \
          mesa-common-dev libglu1-mesa-dev libgl1-mesa-dev libglfw3-dev \
          libx11-dev libxrandr-dev libxcursor-dev libxinerama-dev libxi-dev

    - name: "Build: Daslang (for das2rst + imgui2rst + vulkan2rst)"
      run: |
        set -eux
        mkdir build
        cmake --no-warn-unused-cli -B./build \
          -DCMAKE_BUILD_TYPE:STRING=Release \
          -DDAS_HV_DISABLED=OFF \
          -DDAS_PUGIXML_DISABLED=OFF \
          -DDAS_LLVM_DISABLED=ON \
          -DDAS_GLFW_DISABLED=OFF \
          -DDAS_VULKAN_DISABLED=OFF \
          -DDAS_BUILD_DOCUMENTATION=ON \
          -G Ninja
        cmake --build ./build --target daslang

    - name: "Run das2rst"
      run: cmake --build ./build --target check_docs_generated

    - name: "Run imgui2rst"
      # dasImgui's stdlib pages (doc/source/stdlib/generated/imgui_*.rst) come
      # from its own generator — the imgui modules carry macro-generated
      # surfaces das2rst's reflection pass can't group.
      run: ./bin/daslang modules/dasImgui/utils/imgui2rst.das

    - name: "Run vulkan2rst"
      # dasVulkan's stdlib pages (doc/source/stdlib/generated/vulkan_*.rst) come
      # from its own generator — it introspects the loaded boost modules via RTTI
      # and never creates a Vulkan instance, so this needs no GPU and no lavapipe.
      run: ./bin/daslang modules/dasVulkan/utils/vulkan2rst.das

    - name: "Stage tutorial recordings (docs-assets release)"
      # The `.. video::` directive fails the -W sphinx build on any recording
      # missing from _static/tutorials/, so staging must precede build_doc.
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: bash utils/internal/docs-assets/fetch.sh

    - name: "Check for // `stub` in handmade docs"
      run: |
        set -eux
        if grep -rl '// stub' doc/source/stdlib/handmade/; then
          echo "ERROR: Found // stub entries in handmade docs. Please provide proper documentation."
          exit 1
        fi

    - name: "Check for Uncategorized sections"
      run: |
        set -eux
        if grep -rl '^Uncategorized$' doc/source/stdlib/generated/; then
          echo "ERROR: Found Uncategorized sections in generated docs."
          echo "Add the function(s) to a group_by_regex() in the generator that owns"
          echo "the page: doc/reflections/das2rst.das, modules/dasImgui/utils/imgui2rst.das,"
          echo "or modules/dasVulkan/utils/vulkan2rst.das."
          exit 1
        fi

    - name: "Check for new untracked RST files"
      run: |
        set -eux
        UNTRACKED=$(git ls-files --others --exclude-standard doc/source/stdlib/)
        if [ -n "$UNTRACKED" ]; then
          echo "ERROR: das2rst generated new files not tracked in git:"
          echo "$UNTRACKED"
          echo "Run das2rst locally and commit the new files."
          exit 1
        fi

    - name: "Build documentation (HTML)"
      run: cmake --build ./build --target build_doc
