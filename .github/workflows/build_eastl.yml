name: build_eastl

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# Compile-coverage for the dagor config: EASTL containers, dag::Vector as
# das::vector (uint32_t size_type), ska::flat_hash_map as das_map, DAS_CUSTOM_HASH
# undefined, no global new/delete. Built with gcc, whose uninitialized analysis is
# what this lane guards.
# See cmake/das_config_eastl/daScript/das_config.h and ci/build_eastl_config.sh.
jobs:
  build_eastl:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pc: compiler binary, fileio on. no_fileio: no filesystem and no
        # environment (what a console build gets), static lib only, still on the
        # host toolchain - console SDKs cannot run in public CI.
        variant: [pc, no_fileio]
    steps:
      - uses: actions/checkout@v4
      - uses: lukka/get-cmake@latest
      - run: sudo apt-get update -y && sudo apt-get install -y bison flex g++
      - name: sparse-checkout dagor headers
        run: |
          git clone --depth 1 --filter=blob:none --sparse \
            https://github.com/GaijinEntertainment/DagorEngine.git .dagor_headers
          git -C .dagor_headers sparse-checkout set \
            prog/1stPartyLibs/dag prog/3rdPartyLibs/eastl prog/3rdPartyLibs/ska_hash_map prog/dagorInclude/util
      - run: ci/build_eastl_config.sh ${{ matrix.variant }}
        env:
          DAGOR_ROOT: ${{ github.workspace }}/.dagor_headers
      - name: smoke run
        if: matrix.variant == 'pc'
        run: ./bin/daslang_static examples/clargs/main.das -- --name ci -r 1
