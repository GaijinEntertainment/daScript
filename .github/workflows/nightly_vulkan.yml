name: Nightly dasVulkan

# The dasVulkan render/compute suite: full integration + tutorial pixel-oracle
# tests on lavapipe (software Vulkan) on Linux, and a build + loader-discovery
# smoke on macOS (GitHub's macOS runners expose only AppleParavirtGPU, which
# cannot run the render suite — stock MoltenVK crashes in device init there).
# Windows has no lane: needs lavapipe/SwiftShader wiring (module ROADMAP).
# Nightly + on-demand only; the per-PR gate is vulkan_checks.yml (paths-filtered).

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: nightly-vulkan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  integration_linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Install lavapipe (software Vulkan) + tools"
        # The lavapipe ICD JSON path is not stable across distro versions, so
        # discover it after install rather than hardcoding it (a missing
        # VK_DRIVER_FILES path disables default ICD discovery entirely ->
        # ERROR_INCOMPATIBLE_DRIVER). Export the found path for later steps.
        run: |
          sudo bash ci/apt_install.sh mesa-vulkan-drivers libvulkan1 vulkan-tools
          LVP=$(find /usr -iname 'lvp_icd*.json' 2>/dev/null | head -1)
          if [ -n "$LVP" ]; then
            echo "lavapipe ICD: $LVP"
            echo "VK_DRIVER_FILES=$LVP" >> "$GITHUB_ENV"
          else
            echo "WARNING: lavapipe ICD not found; relying on default loader discovery"
          fi

      - name: "Install CMake and Ninja"
        uses: lukka/get-cmake@latest

      - name: "Set up sccache"
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: "Configure"
        # dasModuleStbImage: the texture tutorials' oracles (tut 8/10) load real
        # JPG/HDR maps. dasModulePUGIXML: the generator's vk.xml parser (the
        # skip-ratchet re-run). dasModuleVulkan is the shared twin the dynamic
        # daslang host loads; built at --parallel 2 because its ~55 generated
        # template-heavy TUs OOM a 7 GB runner at full parallelism.
        run: |
          set -eux
          cmake --no-warn-unused-cli -B./build \
            -DCMAKE_BUILD_TYPE:STRING=Release \
            -DDAS_HV_DISABLED=ON \
            -DDAS_LLVM_DISABLED=ON \
            -DDAS_GLFW_DISABLED=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DDAS_VULKAN_COMPILE_JOBS=2 \
            -G Ninja

      - name: "Verify lavapipe is visible to the loader"
        # No `|| true` — a missing driver should fail loudly here rather than
        # let every test report the same error.
        run: vulkaninfo --summary | grep -iE "deviceName|llvmpipe|apiVersion"

      - name: "Every dasVulkan check (offscreen, lavapipe)"
        # Shaders are daslang, lowered to SPIR-V by dasSpirv at compile time —
        # no committed .spv. MUST NOT run under sudo: the loader ignores
        # VK_DRIVER_FILES for elevated processes.
        run: cmake --build ./build --target run_vulkan

  build_macos:
    # Build + loader-discovery smoke only (see the header comment). Exercises the
    # APPLE branch: dasVULKAN.metal.mm, Cocoa/QuartzCore, MoltenVK via Homebrew.
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Install Vulkan loader + MoltenVK + bison"
        # macOS ships bison 2.3, too old for daslang's grammar.
        run: |
          brew install vulkan-loader molten-vk bison
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: "Install CMake and Ninja"
        uses: lukka/get-cmake@latest

      - name: "Set up sccache"
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: "Configure"
        run: |
          set -eux
          cmake --no-warn-unused-cli -B./build \
            -DCMAKE_BUILD_TYPE:STRING=Release \
            -DDAS_HV_DISABLED=ON \
            -DDAS_LLVM_DISABLED=ON \
            -DDAS_GLFW_DISABLED=ON \
            -DDAS_VULKAN_DISABLED=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DDAS_VULKAN_COMPILE_JOBS=2 \
            -G Ninja

      - name: "Loader-discovery smoke (no render)"
        # Proves das_volkInitialize finds the Homebrew loader.
        run: cmake --build ./build --target run_vulkan_smoke

