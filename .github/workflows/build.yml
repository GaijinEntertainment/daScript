name: build

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly: runs everything the per-PR lanes deliberately skip —
    #  * the heavy Windows toolchain builds (mingw, clang-cl), gated OFF per-PR
    #    below (see their `if:`), including their FULL AOT sweeps;
    #  * the main matrix (Release cells carry the FULL test_aot build + AOT
    #    suite — "Slow Release Tests"; Debug cells ride along, matrix can't be
    #    filtered in a job-level `if`). Per-PR CI only builds test_aot_subset
    #    (tests/language, part of ALL) as a compile+link gate and runs no AOT
    #    tests at all.
    # bundle_smoke / gcc stay per-PR-only. A manual `workflow_dispatch` runs
    # the FULL workflow: every per-PR job, both toolchains, and the full AOT
    # suite.
    # 02:00 UTC: dead time for EU working hours — the nightly is ~12 jobs and
    # must not compete with daytime PR lanes for runners.
    - cron: '0 2 * * *'
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  ###########################################################
  pre_job:
  ###########################################################
    # continue-on-error: true # Uncomment once integration is finished
    runs-on: ubuntu-latest
    # Map a step output to a job output
    outputs:
      should_skip: ${{ steps.skip_check.outputs.should_skip }}
    steps:
      - id: skip_check
        uses: fkirc/skip-duplicate-actions@v5
        with:
          # All of these options are optional, so you can remove them if you are happy with the defaults
          concurrent_skipping: 'same_content'
          do_not_skip: '["pull_request", "workflow_dispatch", "release"]'

      - name: Cache LLVM
        uses: actions/cache@v3
        id: llvm-cache
        with:
          # Cache LLVM.dll, to make CI faster.
          path: build/_deps/das_llvm_shared_lib-src
          key: ${{ runner.os }}-${{ hashFiles('modules/dasLLVM/CMakeLists.txt') }}

  ###########################################################
  build:
  ###########################################################
    needs: pre_job
    # Per-PR/push lane (also on manual `workflow_dispatch`). On the nightly
    # `schedule` cron the matrix runs too — the Release cells carry the full
    # AOT suite (see "Slow Release Tests") — unconditionally on the canonical
    # repo (no pre_job skip: master unchanged overnight must still produce the
    # nightly AOT signal). Debug cells ride along at night without an AOT step;
    # `matrix` context is not available in a job-level `if`, so they can't be
    # excluded here (actions runs with a matrix clause fail as a workflow-file
    # error before any job spawns).
    if: >-
      (github.event_name == 'schedule' && github.repository == 'GaijinEntertainment/daScript')
      || (github.event_name != 'schedule' && needs.pre_job.outputs.should_skip != 'true')
    runs-on: ${{ matrix.runner }}
    # actions: write needed for `gh cache delete` in the sccache refresh step.
    permissions:
      contents: read
      actions: write
    env:
      das_dll_build: 'NO'
      das_llvm_disabled: 'OFF'
    strategy:
      fail-fast: false
      matrix:
        target: [linux, linux_arm, darwin15, darwin26, windows]
        architecture: [32, 64, arm64]
        cmake_preset: [ Debug, Release ]
        sanitizers: [none]

        include:
          - target: linux
            release_target: linux
            release_arch: x86_64
            runner: ubuntu-latest
            archive_ext: tar.gz
            sanitizers: none

          # Sanitizer matrix — Linux + Release + full tests (dastest + test_aot
          # + ctest). Release keeps walltime in budget; the previous Debug+ASAN
          # was prohibitive for production CI. See issue #2530.
          - target: linux
            architecture: 64
            runner: ubuntu-latest
            cmake_preset: Release
            sanitizers: asan
            build_name: linux_asan
            build_system: cmake
            cmake_generator: Ninja

          - target: linux
            architecture: 64
            runner: ubuntu-latest
            cmake_preset: Release
            sanitizers: tsan
            build_name: linux_tsan
            build_system: cmake
            cmake_generator: Ninja

          - target: linux
            architecture: 64
            runner: ubuntu-latest
            cmake_preset: Release
            sanitizers: ubsan
            build_name: linux_ubsan
            build_system: cmake
            cmake_generator: Ninja

          - target: linux_arm
            release_target: linux
            release_arch: arm64
            runner: ubuntu-24.04-arm
            archive_ext: tar.gz

          - target: darwin15
            architecture: arm64
            release_target: darwin15
            release_arch: arm64
            runner: macos-15 # Apple Silicon arm64, M2
            architecture_string: arm64
            archive_ext: tar.gz

          - target: darwin26
            release_target: darwin26
            release_arch: arm64
            runner: macos-26 # Apple Silicon arm64, M2
            architecture_string: arm64
            archive_ext: tar.gz

          - target: windows
            runner: windows-latest
            archive_ext: zip

          - target: windows
            build_system: cmake
            cmake_generator: Ninja

          - target: darwin15
            build_system: cmake
            cmake_generator: Ninja

          - target: darwin26
            build_system: cmake
            cmake_generator: Ninja

          - target: linux
            build_system: cmake
            cmake_generator: Ninja

          - target: linux_arm
            build_system: cmake
            cmake_generator: Ninja

          - target: windows
            release_target: windows
            release_arch: x86
            architecture: 32
            architecture_string: Win32

          - target: windows
            release_target: windows
            release_arch: x86_64
            architecture: 64
            architecture_string: x64

          # The regular Win64 Release lane is the fast MSVC compile/interpreter
          # gate. LLVM + the JIT sweep are preserved by the nightly copy below.
          - target: windows
            architecture: 64
            cmake_preset: Release
            llvm_disabled: 'ON'
            jit_disabled: 'ON'

          # Debug Win64 also skips JIT. RelWithDebInfo is a separate
          # nightly-only memory/leak diagnostic.
          - target: windows
            architecture: 64
            cmake_preset: Debug
            jit_disabled: 'ON'

        exclude:
          # macOS Intel (darwin15 x86_64) has no prebuilt LLVM.dll (the
          # llvm-release workflow doesn't build one) and Apple no longer makes
          # new Intel macOS runners worth gating on. Drop entirely.
          - target: darwin15
            architecture: 64

          - target: darwin15
            architecture: 32

          - target: darwin26
            architecture: 32

          - target: darwin26
            architecture: 64

          - target: linux
            architecture: 32

          - target: linux
            architecture: arm64

          - target: linux_arm
            architecture: 32

          - target: linux_arm
            architecture: arm64 # todo

          - target: windows
            architecture: arm64 # todo https://github.com/actions/partner-runner-images/tree/main?tab=readme-ov-file#available-images

          # win32 Debug outgrew its test budgets (the interpreter sweep double-times-out at
          # 1800s + 5400s on master's own scheduled runs, ~2.5h wall before failing) and the
          # 32-bit rail is legacy — win32 Release stays as the 32-bit compile+test gate.
          - target: windows
            architecture: 32
            cmake_preset: Debug

    steps:
    - name: "SCM Checkout"
      uses: actions/checkout@v4

    - name: "Exclude workspace from Windows Defender"
      if: runner.os == 'Windows'
      shell: pwsh
      continue-on-error: true
      # Defender real-time scan of freshly-written .obj/.exe/.dll slows the build
      # and can momentarily lock a just-linked exe (the "Access is denied" deploy
      # race). Exclude the workspace + toolchain writers and try to disable RTP;
      # the status dump records whether the runner image actually honored it
      # (managed Defender / Tamper Protection may silently no-op).
      # continue-on-error: a managed-Defender runner must not fail the job.
      run: |
        Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue
        foreach ($p in 'daslang.exe','daslang_static.exe','test_aot.exe','cl.exe','link.exe','lld-link.exe','mt.exe','vctip.exe','mspdbsrv.exe','vcpkg.exe') {
          Add-MpPreference -ExclusionProcess $p -ErrorAction SilentlyContinue
        }
        Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
        Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, IsTamperProtected
        Get-MpPreference | Select-Object -ExpandProperty ExclusionPath

    - name: "Install CMake and Ninja"
      uses: lukka/get-cmake@latest

    - if: runner.os == 'Windows'
      uses: ilammy/setup-nasm@v1 # need nasm for openssl

    - name: "Set up MSVC environment (Windows)"
      if: runner.os == 'Windows'
      # cl.exe on PATH so the bash build step drives Ninja with MSVC. arch
      # follows the matrix (x86 for the 32-bit job). MUST run BEFORE the vcpkg
      # openssl step: msvc-dev-cmd's vcvars sets VCPKG_ROOT to the VS-bundled
      # vcpkg, so the openssl step has to write our VCPKG_ROOT last.
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.architecture == 32 && 'x86' || 'x64' }}

    # Restore here, save below on master only. A plain actions/cache also SAVES,
    # and a save from a PR run is scoped to refs/pull/N/merge, where no sibling PR
    # can read it — so the cache looked populated (6 entries, ~836MB of quota) while
    # every Windows job still missed and rebuilt openssl from source, 8.5 min a run.
    # This job is the SEEDER for both arch keys; every other Windows job in the repo
    # is restore-only, so there is exactly one writer per key and no save race.
    # Not on the cron: nightlies consume no cache (they are not a show-stopper),
    # so the scheduled run builds openssl from source and then re-seeds below.
    - name: "Restore vcpkg + openssl"
      if: runner.os == 'Windows' && github.event_name != 'schedule'
      uses: actions/cache/restore@v4
      with:
        # vcpkg.exe + ports/triplets/scripts + installed/<triplet>/openssl. Build
        # intermediates (buildtrees/downloads/packages) are trimmed pre-save below.
        path: vcpkg
        key: vcpkg-${{ matrix.architecture == 32 && 'x86' || 'x64' }}-windows-v2

    - name: "Install openssl windows"
      if: runner.os == 'Windows'
      run: |
        if [ ! -x vcpkg/vcpkg.exe ] && [ ! -x vcpkg/vcpkg ]; then
            git clone https://github.com/microsoft/vcpkg && ./vcpkg/bootstrap-vcpkg.sh
        fi
        ./vcpkg/vcpkg install openssl:${{ matrix.architecture == 32 && 'x86' || 'x64' }}-windows --binarycaching
        echo "VCPKG_ROOT=$(pwd)/vcpkg" >> $GITHUB_ENV
        echo "CMAKE_TOOLCHAIN_FILE=$(pwd)/vcpkg/scripts/buildsystems/vcpkg.cmake" >> $GITHUB_ENV
        # Drop build intermediates so the saved cache holds only installed/ — ~1.2GiB -> ~0.1GiB.
        rm -rf vcpkg/buildtrees vcpkg/downloads vcpkg/packages

    # Master only, so the entry lands on refs/heads/master where every branch and
    # PR can read it. One writer per arch key: the Release cell of each Windows
    # architecture (Debug shares the x64 key and would otherwise race it —
    # "Unable to reserve cache with key ..., another job may be creating this cache").
    - name: "Save vcpkg + openssl"
      if: runner.os == 'Windows' && github.ref == 'refs/heads/master' && matrix.cmake_preset == 'Release'
      uses: actions/cache/save@v4
      with:
        path: vcpkg
        key: vcpkg-${{ matrix.architecture == 32 && 'x86' || 'x64' }}-windows-v2

    - name: "Install: Required Dev Packages"
      run: |
        set -eux
        case "${{ matrix.target }}${{ matrix.architecture }}" in
          darwin15arm64|darwin26arm64)
            brew install bison
            echo 'export PATH="/usr/local/opt/bison/bin:$PATH"' >> ~/.bash_profile
            export LDFLAGS="-L/usr/local/opt/bison/lib"
            ;;
          darwin1564|darwin2664)
            brew install bison
            echo 'export PATH="/opt/homebrew/opt/bison/bin:$PATH"' >> ~/.bash_profile
            export LDFLAGS="-L/opt/homebrew/opt/bison/lib"
            ;;
        esac

        case "${{ matrix.target }}${{ matrix.architecture }}" in
          linux64)
            echo "MARCH=64" >> $GITHUB_ENV
            sudo bash ci/apt_install.sh --no-install-recommends \
              libatomic-ops-dev \
              libglu1-mesa-dev \
              freeglut3-dev \
              mesa-common-dev \
              libglfw3-dev \
              libfreetype6-dev \
              libudev-dev \
              libopenal-dev \
              libvorbis-dev \
              libflac-dev \
              libclang-dev \
              libx11-dev \
              libxrandr-dev \
              libxcursor-dev \
              libxinerama-dev \
              libxi-dev
            ;;
        esac

    # sccache with LOCAL-DISK backend, wrapped in ONE actions/cache entry per
    # matrix config. The GHA backend writes one cache item per TU (~40k items,
    # quota fragmentation, ~74% concurrent-write failures); local disk keeps
    # all objects in $SCCACHE_DIR and we persist it as a single tarball.
    # Windows is on Ninja now (honors CMAKE_*_COMPILER_LAUNCHER); its MSVC
    # compiles are cacheable because daslang builds with /Z7 (CMakeCommon.txt) —
    # debug info embedded in the .obj. sccache refuses to cache /Zi (separate
    # shared PDB) output.
    - uses: mozilla-actions/sccache-action@v0.0.10
    - run: |
        echo "SCCACHE_DIR=${{ runner.temp }}/sccache" >> $GITHUB_ENV
        echo "SCCACHE_GHA_ENABLED=false" >> $GITHUB_ENV
        # Non-Windows: export the launcher via env (also wraps the GLFW/libhv
        # ExternalProject sub-builds — harmless on gcc/clang). Windows must NOT
        # export it: CMake seeds CMAKE_<LANG>_COMPILER_LAUNCHER from the env
        # into the sub-cmakes, where sccache + MSVC /Zi (those sub-builds keep
        # /Zi) + parallel Ninja collide on the shared glfw.pdb (C1041). Windows
        # instead passes the launcher as -D on the MAIN configure only (Build
        # step), scoping sccache to daslang's own /Z7 TUs.
        if [ "$RUNNER_OS" != "Windows" ]; then
          echo "CMAKE_C_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
          echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache" >> $GITHUB_ENV
        fi
    # Stable per-config key, one fixed slot. On master, delete + re-save the
    # same key after Build so the slot is overwritten with fresh objects (GHA
    # caches are immutable — plain save under an existing key is a no-op, so we
    # delete first). PRs read-only. Bounded footprint: N configs × one tarball,
    # no run_id pileup. The cron does NOT restore — nightlies consume no cache
    # and build cold by policy — but its save still lands a complete fresh
    # object set, and that save is the seeder every PR lane warms from (master
    # PUSH runs are usually pre_job-skipped as same-content duplicates).
    - name: "Restore sccache objects"
      if: github.event_name != 'schedule'
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/sccache
        key: sccache-${{ matrix.target }}-${{ matrix.architecture }}-${{ matrix.cmake_preset }}-${{ matrix.sanitizers }}

    - name: "Override das_llvm_disabled for LLVM-free matrix cells"
      if: (matrix.target == 'windows' && matrix.architecture == 32) || matrix.llvm_disabled == 'ON'
      shell: bash
      run: echo "das_llvm_disabled=ON" >> $GITHUB_ENV

    - name: "Build: Daslang"
      run: |
        set -eux
        mkdir build
        case "${{ matrix.build_system }}" in
          cmake)
            case "${{ matrix.target }}${{ matrix.architecture }}" in
              linux64)
                CC=clang CXX=clang++ cmake --no-warn-unused-cli -B./build -DCMAKE_BUILD_TYPE:STRING=${{ matrix.cmake_preset }} -G \
                        "${{ matrix.cmake_generator }}" -DDAS_USE_SANITIZER=${{ matrix.sanitizers }} -DDAS_LLVM_DISABLED=${{ env.das_llvm_disabled }}
                cd build
                ninja
                ;;
              windows32)
                export PATH="/c/Strawberry/perl/bin:$PATH" # prepend Strawberry perl to path, so openssl will use it.
                # Launcher passed as -D here (not env) so it scopes to daslang's
                # own targets and does NOT leak into the GLFW/libhv sub-builds.
                # daslang's MSVC debug info is /Z7 (CMakeCommon.txt) so sccache
                # can cache it.
                cmake --no-warn-unused-cli -B./build -G "${{ matrix.cmake_generator }}" -DCMAKE_BUILD_TYPE:STRING=${{ matrix.cmake_preset }} -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
                cmake --build ./build --config ${{ matrix.cmake_preset }} --parallel
                ;;
              windows64)
                export PATH="/c/Strawberry/perl/bin:$PATH" # prepend Strawberry perl to path, so openssl will use it.
                # Launcher passed as -D here (not env) so it scopes to daslang's
                # own targets and does NOT leak into the GLFW/libhv sub-builds.
                # daslang's MSVC debug info is /Z7 (CMakeCommon.txt) so sccache
                # can cache it.
                cmake --no-warn-unused-cli -B./build -G "${{ matrix.cmake_generator }}" -DCMAKE_BUILD_TYPE:STRING=${{ matrix.cmake_preset }} -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DDAS_LLVM_DISABLED=${{ env.das_llvm_disabled }} -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
                cmake --build ./build --config ${{ matrix.cmake_preset }} --parallel
                ;;
              linux_arm*)
                CC=clang CXX=clang++ cmake --no-warn-unused-cli -B./build -DCMAKE_BUILD_TYPE:STRING=${{ matrix.cmake_preset }} -DDAS_GLFW_DISABLED=ON -DDAS_HV_DISABLED=OFF -DDAS_SQLITE_DISABLED=OFF -DDAS_LLVM_DISABLED=${{ env.das_llvm_disabled }} -G \
                        "${{ matrix.cmake_generator }}"
                cd build
                ninja
                ;;
              *)
                CC=clang CXX=clang++ cmake --no-warn-unused-cli -B./build -DCMAKE_OSX_ARCHITECTURES="${{ matrix.architecture_string }}" -DCMAKE_BUILD_TYPE:STRING=${{ matrix.cmake_preset }} -DDAS_LLVM_DISABLED=${{ env.das_llvm_disabled }} -G "${{ matrix.cmake_generator }}"
                cd build
                ninja
                ;;
            esac
            ;;
        esac

    - name: "Refresh sccache slot"
      if: github.ref == 'refs/heads/master'
      env:
        GH_TOKEN: ${{ github.token }}
        SCKEY: sccache-${{ matrix.target }}-${{ matrix.architecture }}-${{ matrix.cmake_preset }}-${{ matrix.sanitizers }}
      run: gh cache delete "$SCKEY" -R ${{ github.repository }} || true
    - name: "Save sccache objects"
      if: github.ref == 'refs/heads/master'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/sccache
        key: sccache-${{ matrix.target }}-${{ matrix.architecture }}-${{ matrix.cmake_preset }}-${{ matrix.sanitizers }}

    # NOTE: the "Prewarm JIT cache" step (jit_cache_all_tests, ~17 min on the
    # win64 lane) is GONE: the JIT sweep now runs isolated-PARALLEL and mints
    # the dll cache itself — cold-cache parallel measured faster than the old
    # warm sequential sweep, so a separate prewarm only duplicated the
    # frontend-compile of every test. The target still exists for local use.
    - name: "Test"
      run: |
        set -eux
        # When daslang is sanitizer-instrumented, its JIT-emitted .dll cache
        # link cmd needs -fsanitize=<kind> to pull the sanitizer runtime
        # (otherwise unresolved __ubsan_*/__asan_*/__tsan_* symbols in lib.so).
        JIT_LINKER_STRING=""
        case "${{ matrix.sanitizers }}" in
            ubsan) JIT_LINKER_STRING="--jit-linker-string=-fsanitize=undefined" ;;
            asan)  JIT_LINKER_STRING="--jit-linker-string=-fsanitize=address"   ;;
            tsan)  JIT_LINKER_STRING="--jit-linker-string=-fsanitize=thread"    ;;
        esac
        # daslang built with clang on sanitizer matrix — JIT-emitted .dll
        # must link with the same compiler (incompatible asan/tsan runtimes
        # otherwise). c++ default = g++ on Ubuntu, mismatches.
        JIT_PATH_TO_LINKER=""
        if [ "${{ matrix.sanitizers }}" != "none" ] && [ -n "${{ matrix.sanitizers }}" ]; then
            JIT_PATH_TO_LINKER="--jit-path-to-linker=clang++"
        fi
        # Match JIT codegen opt level to build type: Debug → -O0 (fast codegen),
        # Release/RelWithDebInfo → -O3.
        case "${{ matrix.cmake_preset }}" in
            Debug) JIT_OPT="--jit-opt-level=0" ;;
            *)     JIT_OPT="--jit-opt-level=3" ;;
        esac
        case "${{ matrix.target }}${{ matrix.architecture }}" in
           linux64)
            # LSan suppressions: uriParseSingleUriA / uriMakeOwner (Uri handle bound
            # to daslang without auto-finalize — tracked separately, real fix is in
            # the binding). format_error is deliberately NOT suppressed: FMT_THROW
            # destroys the exception before the panic jump, and this lane is the
            # regression canary for that.
            printf 'leak:uriParseSingleUriA\nleak:uriMakeOwner\n' > suppressions.txt
            export LSAN_OPTIONS="suppressions=$(pwd)/suppressions.txt"
            export TSAN_OPTIONS="suppressions=$(pwd)/.github/tsan_suppressions.txt"
            # Sanitizer matrix: only run language tests under JIT (full test
            # suite under asan/tsan/ubsan adds ~10m wall-clock without proportionate
            # coverage value). Non-sanitizer keeps the full sweep.
            if [ "${{ matrix.sanitizers }}" != "none" ]; then
                TEST_DIR=_dasroot_/tests/language
            else
                TEST_DIR=_dasroot_/tests
            fi
            # Use more time to pass UBSAN and disable leaks in JIT mode because we exit using exit(), and do not call destructors.
            # Debug preset skips JIT — Debug+JIT is slow and, on LLVM ARM64, hangs
            # mid-suite (see linux_arm64 note below); sanitizer cells are Release, so
            # they still run it. Primary sweep is isolated-parallel (batch 4, mints
            # the dll cache itself); retry is batch-1 full isolation.
            [ "${{ env.das_llvm_disabled }}" = "ON" ] || [ "${{ matrix.cmake_preset }}" = "Debug" ] || ASAN_OPTIONS=detect_leaks=0 bin/daslang _dasroot_/dastest/dastest.das -jit -- $JIT_LINKER_STRING $JIT_PATH_TO_LINKER $JIT_OPT --color --failures-only --isolated-mode --batch 4 --timeout 1800 --test $TEST_DIR || ASAN_OPTIONS=detect_leaks=0 bin/daslang _dasroot_/dastest/dastest.das -jit -- $JIT_LINKER_STRING $JIT_PATH_TO_LINKER $JIT_OPT --color --failures-only --isolated-mode --timeout 3600 --test $TEST_DIR
            # Interpreter sweep: non-sanitizer only.
            if [ "${{ matrix.sanitizers }}" = "none" ]; then
                cmake --build ./build --config ${{ matrix.cmake_preset }} --target run_tests_interpreter || cmake --build ./build --config ${{ matrix.cmake_preset }} --target run_tests_interpreter_isolated
            fi
            ;;
           windows32)
            cmake --build ./build --config ${{ matrix.cmake_preset }} --target run_tests_interpreter || cmake --build ./build --config ${{ matrix.cmake_preset }} --target run_tests_interpreter_isolated
            ;;
           windows*)
            # Debug preset skips JIT (Debug+JIT is slow; ARM64 hang note above) in addition to the jit_disabled cells.
            [ "${{ env.das_llvm_disabled }}" = "ON" ] || [ "${{ matrix.jit_disabled }}" = "ON" ] || [ "${{ matrix.cmake_preset }}" = "Debug" ] || cmake --build ./build --config ${{ matrix.cmake_preset }} --target run_tests_jit || cmake --build ./build --config ${{ matrix.cmake_preset }} --target run_tests_jit_isolated
            cmake --build ./build --config ${{ matrix.cmake_preset }} --target run_tests_interpreter || cmake --build ./build --config ${{ matrix.cmake_preset }} --target run_tests_interpreter_isolated
            ;;
           linux_arm64)
            # Skip JIT tests on the Debug cmake preset — LLVM ARM64 SelectionDAG
            # hangs reproducibly mid-suite under Debug (different test each run,
            # ~20 min in). Tracked separately. Release of the same matrix still
            # runs JIT — keep --failures-only off there so PASS lines print and
            # name the test running just before the hang if it reoccurs (see
            # RC2 release run #25572466058).
            [ "${{ env.das_llvm_disabled }}" = "ON" ] || [ "${{ matrix.cmake_preset }}" = "Debug" ] || bin/daslang _dasroot_/dastest/dastest.das -jit -- $JIT_LINKER_STRING $JIT_PATH_TO_LINKER $JIT_OPT --color --isolated-mode --batch 4 --timeout 1800 --test _dasroot_/tests || bin/daslang _dasroot_/dastest/dastest.das -jit -- $JIT_LINKER_STRING $JIT_PATH_TO_LINKER $JIT_OPT --color --failures-only --isolated-mode --timeout 3600 --test _dasroot_/tests
            cmake --build ./build --config ${{ matrix.cmake_preset }} --target run_tests_interpreter || cmake --build ./build --config ${{ matrix.cmake_preset }} --target run_tests_interpreter_isolated
            ;;
           *)
            # Debug preset skips JIT (Debug+JIT is slow; ARM64 hang note above).
            [ "${{ env.das_llvm_disabled }}" = "ON" ] || [ "${{ matrix.cmake_preset }}" = "Debug" ] || cmake --build ./build --config ${{ matrix.cmake_preset }} --target run_tests_jit || cmake --build ./build --config ${{ matrix.cmake_preset }} --target run_tests_jit_isolated
            cmake --build ./build --config ${{ matrix.cmake_preset }} --target run_tests_interpreter || cmake --build ./build --config ${{ matrix.cmake_preset }} --target run_tests_interpreter_isolated
            ;;
        esac
    - name: "Small C++ Tests"
      run: |
        set -eux
        # Suppress LSan false-positives from the Uri binding; see "Test" step above
        # for the same suppressions.
        printf 'leak:uriParseSingleUriA\nleak:uriMakeOwner\n' > build/suppressions.txt
        export LSAN_OPTIONS="suppressions=$(pwd)/build/suppressions.txt"
        cd build
        case "${{ matrix.target }}${{ matrix.architecture }}" in
           windows*)
            ctest --build-config "${{ matrix.cmake_preset }}" -L small --output-on-failure
            ;;
           *)
            ctest -L small --output-on-failure
            ;;
        esac
    - name: "Slow Release Tests"
      # Full AOT suite: builds the full test_aot (EXCLUDE_FROM_ALL, ~1080 AOT
      # TUs — the single biggest CI cost) via the run_tests_aot dependency and
      # sweeps all of tests/. Nightly + manual dispatch only; per-PR lanes get
      # the test_aot_subset compile+link gate from the Build step instead.
      if: matrix.cmake_preset == 'Release' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      run: |
        set -eux
        case "${{ matrix.target }}${{ matrix.architecture }}" in
           windows32)
            echo "Skipping AOT tests on 32-bit Windows"
            ;;
           windows*)
            cmake --build ./build --config ${{ matrix.cmake_preset }} --target run_tests_aot
            ;;
           *)
            # Same suppressions as the "Test" step — sanitizer matrix entries
            # need them here too.
            printf 'leak:uriParseSingleUriA\nleak:uriMakeOwner\n' > suppressions.txt
            export LSAN_OPTIONS="suppressions=$(pwd)/suppressions.txt"
            export TSAN_OPTIONS="suppressions=$(pwd)/.github/tsan_suppressions.txt"
            cmake --build ./build --config ${{ matrix.cmake_preset }} --target run_tests_aot
            ;;
        esac

  ###########################################################
  build_windows_relwithdebinfo_nightly:
  ###########################################################
    # RelWithDebInfo is useful as the leak-enabled Windows diagnostic, but it
    # duplicates the Release/Debug compile and interpreter coverage on every
    # PR. Keep it on the canonical nightly and explicit full-workflow runs.
    needs: pre_job
    if: >-
      (github.event_name == 'schedule' && github.repository == 'GaijinEntertainment/daScript')
      || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    env:
      das_dll_build: 'NO'
      das_llvm_disabled: 'OFF'
      SCCACHE_GHA_ENABLED: 'false'

    steps:
    - name: "SCM Checkout"
      uses: actions/checkout@v4

    - name: "Exclude workspace from Windows Defender"
      shell: pwsh
      continue-on-error: true
      run: |
        Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue
        foreach ($p in 'daslang.exe','daslang_static.exe','test_aot.exe','cl.exe','link.exe','mt.exe','vctip.exe','mspdbsrv.exe','vcpkg.exe') {
          Add-MpPreference -ExclusionProcess $p -ErrorAction SilentlyContinue
        }
        Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue

    - name: "Install CMake and Ninja"
      uses: lukka/get-cmake@latest

    - uses: ilammy/setup-nasm@v1

    - name: "Set up MSVC environment"
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    # Restore-only: the PR matrix job above is the single seeder for this key.
    # Skipped on the cron: nightlies consume no cache. Dispatch still restores.
    - name: "Restore vcpkg + openssl"
      if: github.event_name != 'schedule'
      uses: actions/cache/restore@v4
      with:
        path: vcpkg
        key: vcpkg-x64-windows-v2

    - name: "Install openssl windows"
      run: |
        if [ ! -x vcpkg/vcpkg.exe ] && [ ! -x vcpkg/vcpkg ]; then
            git clone https://github.com/microsoft/vcpkg && ./vcpkg/bootstrap-vcpkg.sh
        fi
        ./vcpkg/vcpkg install openssl:x64-windows --binarycaching
        echo "VCPKG_ROOT=$(pwd)/vcpkg" >> $GITHUB_ENV
        rm -rf vcpkg/buildtrees vcpkg/downloads vcpkg/packages

    - uses: mozilla-actions/sccache-action@v0.0.10

    - name: "Configure sccache"
      run: echo "SCCACHE_DIR=${{ runner.temp }}/sccache" >> $GITHUB_ENV

    # NOT persisted across runs, deliberately. This slot held 564MB of the repo's
    # 10GB cache quota, and this job is nightly-only — nothing waits on it. That
    # quota is contended: a Windows object cache is ~4.4GB (920 TUs x ~4.8MB,
    # /Z7 embeds debug info in every .obj), and the PR-facing slots kept evicting
    # each other, which is what left every PR building cold. Paying ~15 min once a
    # night here is the cheapest quota we can free. Re-add a restore/save pair on
    # key sccache-windows-64-RelWithDebInfo-none if the repo cache limit is raised.

    - name: "Build: Daslang RelWithDebInfo"
      run: |
        set -eux
        export PATH="/c/Strawberry/perl/bin:$PATH"
        cmake --no-warn-unused-cli -B./build -G Ninja \
          -DCMAKE_BUILD_TYPE:STRING=RelWithDebInfo \
          -DCMAKE_C_COMPILER_LAUNCHER=sccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
          -DDAS_LLVM_DISABLED=${{ env.das_llvm_disabled }} \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
        cmake --build ./build --config RelWithDebInfo --parallel

    - name: "Test: interpreter"
      run: cmake --build ./build --config RelWithDebInfo --target run_tests_interpreter || cmake --build ./build --config RelWithDebInfo --target run_tests_interpreter_isolated

    - name: "Small C++ Tests"
      run: ctest --test-dir build --build-config RelWithDebInfo -L small --output-on-failure

