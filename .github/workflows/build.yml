  ###########################################################
  bundle_smoke:
  ###########################################################
  # Catches release-bundle install-rule regressions at PR time on the
  # platform that produces 95% of such bugs (Linux x86_64). Mirrors the
  # release.yml linux64 build path: same module flags via ci/release_modules.txt,
  # same install layout (cmake --install --prefix ./daslang_bundle), same
  # ci/smoke_test_bundle.sh that release.yml runs. Full-matrix smoke is
  # still gated at release-cut time in release.yml.
  ###########################################################
    needs: pre_job
    # Per-PR/push lane (also runs on manual `workflow_dispatch`); skipped only on the nightly `schedule` cron.
    if: needs.pre_job.outputs.should_skip != 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
    - name: "SCM Checkout"
      uses: actions/checkout@v4

    - name: "Install CMake and Ninja"
      uses: lukka/get-cmake@latest

    - name: "Install: Required Dev Packages"
      run: |
        set -eux
        sudo bash ci/apt_install.sh --no-install-recommends \
          libatomic-ops-dev \
          libglu1-mesa-dev \
          freeglut3-dev \
          mesa-common-dev \
          libglfw3-dev \
          libfreetype6-dev \
          libudev-dev \
          libopenal-dev \
          libvorbis-dev \
          libflac-dev \
          libx11-dev \
          libxrandr-dev \
          libxcursor-dev \
          libxinerama-dev \
          libxi-dev

    - name: "Build: Daslang with release modules"
      run: |
        set -eux
        mkdir build
        ACTIVE_MODULES=$(cat ci/release_modules.txt | grep -v "^#" | cut -d':' -f2 | sed 's|^|-D|' | xargs)
        CC=clang CXX=clang++ cmake --no-warn-unused-cli -B./build -DCMAKE_BUILD_TYPE:STRING=Release \
          -G Ninja $ACTIVE_MODULES
        cmake --build ./build --config Release --parallel

    - name: "Install bundle"
      run: |
        set -eux
        mkdir daslang_bundle
        cmake --install ./build --prefix ./daslang_bundle --config Release --strip

    - name: "Smoke-test installed bundle"
      run: bash ci/smoke_test_bundle.sh ./daslang_bundle

  ###########################################################
  build_windows_mingw:
  ###########################################################
  # Catches clang-mingw64 toolchain regressions NIGHTLY (moved off per-PR CI —
  # it's a ~26min long pole and alt-toolchain coverage, lowest per-PR signal).
  # The mingw path
  # diverges from MSVC in src/hal/debug_break.cpp, src/hal/project_specific_crash_handler.cpp,
  # and src/builtin/module_jit.cpp (PR #2838). Without this job, a Windows-touching
  # change that compiles under MSVC but breaks mingw would only surface when a
  # maintainer rebuilds locally. Same runner pool as the MSVC matrix
  # (windows-latest), separate top-level job so mingw churn doesn't risk
  # the much-larger MSVC entries.
  #
  # dasClangBind is enabled here — find_package(Clang 22.1) matches msys2's
  # libclang 22.1.x and POST_BUILD copies the libclang+libLLVM+libc++ chain
  # next to daslang.exe so the .shared_module dlopen resolves at runtime.
  ###########################################################
    needs: pre_job
    # NIGHTLY ONLY (+ manual dispatch): off per-PR/push CI. Deliberately does NOT
    # gate on pre_job.should_skip — a nightly run must fire even when master is
    # unchanged (skip-duplicate-actions would otherwise skip it and we'd never
    # catch a toolchain/runner regression on an idle day).
    # scheduled cron runs the toolchains only on the canonical repo, so forks
    # don't run (and fail) the nightly — that would email every fork owner.
    # Manual workflow_dispatch still runs them anywhere.
    if: (github.event_name == 'schedule' && github.repository == 'GaijinEntertainment/daScript') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - name: "SCM Checkout"
      uses: actions/checkout@v4

    - name: "Exclude workspace from Windows Defender"
      if: runner.os == 'Windows'
      shell: pwsh
      continue-on-error: true
      # Defender real-time scan of freshly-written .obj/.exe/.dll slows the build
      # and can momentarily lock a just-linked exe (the "Access is denied" deploy
      # race). Exclude the workspace + toolchain writers and try to disable RTP;
      # the status dump records whether the runner image actually honored it
      # (managed Defender / Tamper Protection may silently no-op).
      # continue-on-error: a managed-Defender runner must not fail the job.
      run: |
        Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue
        foreach ($p in 'daslang.exe','daslang_static.exe','test_aot.exe','cl.exe','link.exe','lld-link.exe','mt.exe','vctip.exe','mspdbsrv.exe','vcpkg.exe') {
          Add-MpPreference -ExclusionProcess $p -ErrorAction SilentlyContinue
        }
        Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
        Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, IsTamperProtected
        Get-MpPreference | Select-Object -ExpandProperty ExclusionPath

    - name: "Install MSYS2 + clang-mingw64 toolchain"
      uses: msys2/setup-msys2@v2
      with:
        msystem: CLANG64
        # cache:false — this job is nightly/dispatch-only and nightlies consume
        # no cache; the msys2 pkg snapshot alone was ~1.65GiB of quota.
        update: false
        cache: false
        install: >-
          mingw-w64-clang-x86_64-toolchain
          mingw-w64-clang-x86_64-cmake
          mingw-w64-clang-x86_64-ninja
          mingw-w64-clang-x86_64-openssl
          mingw-w64-clang-x86_64-glfw
          mingw-w64-clang-x86_64-sccache
          bison
          git

    # sccache (compiler cache) for the mingw lane. mingw builds on Ninja, which
    # honors CMAKE_<LANG>_COMPILER_LAUNCHER (the VS-generator clang-cl lane can't,
    # which is why only this lane gets it). Use the msys2-NATIVE sccache (installed
    # above), not the hostedtoolcache one: a native-Windows sccache fails to
    # CreateProcess msys2's clang.exe (the compiler's runtime DLLs aren't on
    # sccache's PATH). Local-disk backend in one actions/cache slot, same approach
    # as the build matrix. Fixed key (single config); PRs restore read-only, master
    # refreshes the slot after Build.
    - name: "Configure sccache (local-disk backend)"
      shell: bash
      run: |
        echo "SCCACHE_DIR=${{ runner.temp }}/sccache" >> $GITHUB_ENV
        echo "SCCACHE_GHA_ENABLED=false" >> $GITHUB_ENV
    # No slot restore/save: this job is nightly/dispatch-only and nightlies
    # consume no cache. sccache stays as a per-run local-disk launcher only.
    - name: "Build: Daslang (clang-mingw64)"
      run: |
        set -eux
        mkdir -p build-mingw
        cmake --no-warn-unused-cli -B./build-mingw -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=clang \
          -DCMAKE_CXX_COMPILER=clang++ \
          -DCMAKE_C_COMPILER_LAUNCHER=sccache \
          -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
          -DDAS_CLANG_BIND_DISABLED=OFF \
          -DDAS_LLVM_DISABLED=OFF
        cmake --build ./build-mingw --parallel
        sccache --show-stats || true

    - name: "Test: interpreter sweep"
      run: |
        set -eux
        cmake --build ./build-mingw --config Release --target run_tests_interpreter \
          || cmake --build ./build-mingw --config Release --target run_tests_interpreter_isolated

    - name: "Test: JIT sweep"
      run: |
        set -eux
        cmake --build ./build-mingw --config Release --target run_tests_jit \
          || cmake --build ./build-mingw --config Release --target run_tests_jit_isolated

    - name: "Small C++ Tests"
      run: |
        set -eux
        cd build-mingw
        ctest -L small --output-on-failure

    - name: "Slow Release Tests (AOT)"
      run: |
        set -eux
        cmake --build ./build-mingw --config Release --target run_tests_aot

    # bind_clangbind self-binder lives here (not on linux extended_checks)
    # because dasClangBind on linux pulls libclang.so → libLLVM-22.so.1,
    # which collides with dasLLVM in the same process (shared pass
    # registry, double-init breaks JIT). msys2 clang64 ships libclang as
    # a separate SO chain, and the mingw worker doesn't exercise JIT-uses-
    # dasClangBind paths, so they coexist cleanly.
    #
    # TODO: bind_llvm.das self-binder doesn't run on mingw — libclang as
    # library doesn't find <cstddef> via msys2's libcxx auto-detection.
    # Needs explicit -resource-dir / -isystem injection. Tracked as a
    # follow-up; we lose master's previous bind_llvm.das CI coverage in
    # the meantime.
    - name: "Run self-binder (bind_clangbind.das)"
      run: |
        set -eux
        CLANG_INCLUDE="$(cygpath -w "${MSYSTEM_PREFIX}/include")"
        ./bin/daslang.exe modules/dasClangBind/bind/bind_clangbind.das -- --clang_path "${CLANG_INCLUDE}/"
        git diff --exit-code -- modules/dasClangBind/src/ \
          || (echo "ERROR: dasClangBind generated files are out of date. Run './bin/daslang modules/dasClangBind/bind/bind_clangbind.das -- --clang_path <libclang-include-path>' locally and commit the result." && exit 1)

    - name: "Run cbind const-gen regression test"
      # Exercises collectActiveDefines (preprocessor-active constant generation);
      # main returns non-zero on failure. Lives on the mingw worker because that
      # is where libclang/cbind is available (same reason as the self-binder).
      run: ./bin/daslang.exe modules/dasClangBind/tests/test_const_preproc.das

    # TODO: bind_imgui.das self-binder freshness doesn't run on mingw — same
    # msys2 libclang gap as bind_llvm above (parsing imgui.h dies on
    # `fatal error: 'float.h' file not found`; needs explicit -resource-dir /
    # -isystem injection). Until that lands, dasImgui binding freshness is a
    # local-regen discipline (run bind/bind_imgui.das before committing a bump),
    # like it was in the module's standalone-repo era.

  build_windows_clangcl:
  ###########################################################
  # Catches clang-cl build regressions. Builds with Ninja driving clang-cl directly
  # (msvc-dev-cmd's vcvars puts clang-cl + INCLUDE/LIB on PATH) — NOT the VS "ClangCL"
  # toolset. clang-cl sets CMake's MSVC=TRUE but uses clang's resource headers; dasHV
  # builds OpenSSL from source with plain cl, which rejects clang's #include_next
  # <stdint.h> (C1021) — modules/dasHV/scrub_clang_include.cmake strips the clang dir
  # from INCLUDE so cl falls back to MSVC's stdint.h. Without this job that fix — and
  # clang-cl buildability generally — could silently rot.
  #
  # Ninja (not the VS generator) is deliberate: under the VS generator the test-sweep
  # custom targets run through MSBuild's CustomBuild wrapper, which reports the command
  # as "exited with code -1" (MSB8066) for the heavy threaded sweep even though daslang
  # itself exits 0 and every test passes — a false red unique to the VS generator (its
  # ToolTask/pipe handling of a threaded child), reproduced and root-caused locally.
  # Ninja runs daslang.exe directly (like every other Windows lane), so the sweep's real
  # exit code is honored. Same runner pool as the MSVC matrix; separate top-level job.
  # Runs NIGHTLY (off per-PR CI — alt-toolchain, lowest per-PR signal).
  ###########################################################
    needs: pre_job
    # NIGHTLY ONLY (+ manual dispatch): off per-PR/push CI. Does NOT gate on
    # pre_job.should_skip — a nightly run must fire even when master is unchanged.
    # scheduled cron runs the toolchains only on the canonical repo, so forks
    # don't run (and fail) the nightly — that would email every fork owner.
    # Manual workflow_dispatch still runs them anywhere.
    if: (github.event_name == 'schedule' && github.repository == 'GaijinEntertainment/daScript') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
    - name: "SCM Checkout"
      uses: actions/checkout@v4

    - name: "Exclude workspace from Windows Defender"
      if: runner.os == 'Windows'
      shell: pwsh
      continue-on-error: true
      # Defender real-time scan of freshly-written .obj/.exe/.dll slows the build
      # and can momentarily lock a just-linked exe (the "Access is denied" deploy
      # race). Exclude the workspace + toolchain writers and try to disable RTP;
      # the status dump records whether the runner image actually honored it
      # (managed Defender / Tamper Protection may silently no-op).
      # continue-on-error: a managed-Defender runner must not fail the job.
      run: |
        Add-MpPreference -ExclusionPath "${{ github.workspace }}" -ErrorAction SilentlyContinue
        foreach ($p in 'daslang.exe','daslang_static.exe','test_aot.exe','cl.exe','link.exe','lld-link.exe','mt.exe','vctip.exe','mspdbsrv.exe','vcpkg.exe') {
          Add-MpPreference -ExclusionProcess $p -ErrorAction SilentlyContinue
        }
        Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
        Get-MpComputerStatus | Select-Object RealTimeProtectionEnabled, IsTamperProtected
        Get-MpPreference | Select-Object -ExpandProperty ExclusionPath

    - name: "Install nasm (OpenSSL asm)"
      uses: ilammy/setup-nasm@v1

    - name: "Install CMake and Ninja"
      uses: lukka/get-cmake@latest

    - name: "Set up MSVC + clang-cl environment"
      # vcvars puts cl.exe AND clang-cl.exe (VC\Tools\Llvm\x64\bin) on PATH plus
      # INCLUDE/LIB, so Ninja can drive clang-cl directly without the VS generator.
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    # dasHV builds OpenSSL from source here (the path the scrub fix targets), and
    # nmake is serial — ~7 min. Cache the install so only the first run (or a dasHV
    # CMakeLists change) pays it; on a hit find_package(OpenSSL) finds it and the
    # from-source ExternalProject is skipped. (On Ninja CMAKE_<LANG>_COMPILER_LAUNCHER
    # now works, so sccache could be added here later; OpenSSL from-source is unchanged.)
    # Skipped on the cron: nightlies consume no cache, so the scheduled run
    # builds OpenSSL from source (~8 min, budgeted). Dispatch still caches.
    - name: "Cache OpenSSL (clang-cl from-source build)"
      if: github.event_name != 'schedule'
      uses: actions/cache@v4
      with:
        path: |
          build-clangcl/openssl/include
          build-clangcl/openssl/lib
          build-clangcl/openssl/bin
        key: openssl-clangcl-${{ runner.os }}-${{ hashFiles('modules/dasHV/CMakeLists.txt') }}

    - name: "Build: Daslang (Ninja + clang-cl)"
      shell: pwsh
      # Ninja + clang-cl (from vcvars PATH). No VS-generator, so no VS-major pinning
      # to the runner image and no MSBuild CustomBuild sweep wrapper (see job header).
      run: |
        cmake -B build-clangcl -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
        if ($LASTEXITCODE -ne 0) { exit 1 }
        cmake --build build-clangcl --parallel
        if ($LASTEXITCODE -ne 0) { exit 1 }

    - name: "Test: interpreter sweep"
      shell: pwsh
      run: |
        cmake --build build-clangcl --target run_tests_interpreter
        if ($LASTEXITCODE -ne 0) { exit 1 }

    - name: "Test: AOT sweep"
      shell: pwsh
      run: |
        cmake --build build-clangcl --target run_tests_aot
        if ($LASTEXITCODE -ne 0) { exit 1 }

    - name: "Small C++ tests"
      shell: pwsh
      run: |
        cd build-clangcl
        ctest -L small --output-on-failure
        if ($LASTEXITCODE -ne 0) { exit 1 }

  build_linux_gcc:
  # (Per-PR/push lane, also on manual `workflow_dispatch`; skipped only on the nightly `schedule` cron — see if: below.)
  ###########################################################
  # Catches gcc-only -Werror breaks at PR time. Every Linux lane in this
  # workflow builds with CC=clang CXX=clang++, so warnings that only gcc emits
  # (glibc warn_unused_result on chdir/etc., -Wstringop-overflow / -Warray-bounds
  # / -Wmaybe-uninitialized false positives under -O3) are invisible to our own
  # CI and only ever surface downstream, where external module repos build
  # daslang from source with the default system g++ (e.g. dasImguiNodeEditor's
  # ubuntu-latest job). This job closes that gap. Compile-only: the clang lanes
  # already run the test sweeps; the point here is the strict-warning gate.
  #
  # Config mirrors the linux_arm lane (GLFW off, HV+SQLITE on); LLVM is left off
  # to keep this fast — its module also goes through DAS_APPLY_STRICT_WARNINGS,
  # but the LLVM build dominates walltime and the bulk of strict-compiled code
  # (core + HV/SQLITE/Audio/PUGIXML/UnitTest modules) is covered without it.
  ###########################################################
    needs: pre_job
    if: needs.pre_job.outputs.should_skip != 'true' && github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
    - name: "SCM Checkout"
      uses: actions/checkout@v4

    # Pinned CMake + Ninja, matching the other Linux jobs (bison is preinstalled
    # on the ubuntu runners — the matrix linux64 job relies on it the same way).
    - name: "Get CMake + Ninja"
      uses: lukka/get-cmake@latest

    - name: "Build: Daslang (gcc -Werror)"
      run: |
        set -eux
        CC=gcc CXX=g++ cmake --no-warn-unused-cli -B./build-gcc -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DDAS_GLFW_DISABLED=ON \
          -DDAS_HV_DISABLED=OFF \
          -DDAS_SQLITE_DISABLED=OFF \
          -DDAS_LLVM_DISABLED=ON
        cmake --build ./build-gcc --parallel

