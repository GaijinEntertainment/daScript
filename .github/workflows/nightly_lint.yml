name: nightly whole-tree lint

# Whole-tree nightly: catches what a changed-set lane cannot — new rules on
# unchanged files, generic bodies only a consumer instantiates, generated files,
# default flips. The tree is at zero findings by policy, so ANY finding is red.
#
# Two passes:
#   1. fast parallel rule pass with LINT019 (stale-nolint) disabled — worker
#      processes fragment the nolint-consumption ledger, which makes staleness
#      unreliable in parallel mode;
#   2. single-process (-j 1) full pass — the only scope where "this directive
#      consumed nothing" is a true statement, because every consumer's
#      instantiations feed one ledger.
#
# Both passes run on every build, and the job is red if either found something.
# They report different defect classes, so stopping at the first would hide the
# second until some later night when pass 1 happens to be clean.
#
# The summary's "skipped" count is coverage: a silent shrink is a regression
# (dasLLVM, dasSMT/z3, macOS-only files surface there, not as reds).

on:
  schedule:
    # 03:30 UTC — staggered after build.yml 02:00, daspkg-index 02:30, imgui 03:00.
    - cron: '30 3 * * *'
  workflow_dispatch:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    if: github.event_name != 'schedule' || github.repository == 'GaijinEntertainment/daScript'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      SCCACHE_GHA_ENABLED: "false"
    steps:
      - name: "SCM Checkout"
        uses: actions/checkout@v4

      - name: "Install system dependencies"
        run: |
          sudo bash ci/apt_install.sh \
            libglfw3-dev \
            libfreetype6-dev \
            mesa-common-dev \
            xorg-dev

      - name: "Install CMake and Ninja"
        uses: lukka/get-cmake@latest

      - name: "Set up sccache"
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: "Configure"
        run: |
          set -eux
          cmake --no-warn-unused-cli -B./build \
            -DCMAKE_BUILD_TYPE:STRING=Release \
            -DDAS_HV_DISABLED=OFF \
            -DDAS_PUGIXML_DISABLED=OFF \
            -DDAS_SQLITE_DISABLED=OFF \
            -DDAS_LLVM_DISABLED=ON \
            -DDAS_GLFW_DISABLED=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -G Ninja

      - name: "Lint the whole tree"
        run: cmake --build ./build --target check_lint_tree

  nightly_issue:
    needs: [lint]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    uses: ./.github/workflows/nightly_issue.yml
    with:
      lane: nightly_lint.yml
