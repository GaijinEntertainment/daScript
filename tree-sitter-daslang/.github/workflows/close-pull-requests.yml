name: Close pull requests

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    name: Send the pull request to the daslang repository
    if: vars.MIRROR_SYNC == 'on'
    runs-on: ubuntu-latest
    steps:
      - name: Close the pull request
        env:
          GH_TOKEN: ${{github.token}}
          PULL_REQUEST: ${{github.event.pull_request.html_url}}
          COMMENT: >-
            This repository is a read-only copy of the tree-sitter-daslang
            directory of the daslang repository,
            https://github.com/GaijinEntertainment/daScript. Open the pull
            request there.
        run: gh pr close "${PULL_REQUEST}" --comment "${COMMENT}"
