# dasweb-playground starter config. Deployed beside the binary; edits there
# survive upgrades (release_include_if_missing). CLI flags override these
# unless `authoritative = true` is set.
#
# These are DEVELOPMENT values on purpose. The file is discovered automatically
# beside the module, so production absolute paths here would make any in-repo
# run open the live database. Deployed values live on the box — README.md (Run)
# lists them.
port = 8101
db = "samples.db"
base_url = "http://127.0.0.1:8101"
max_source_bytes = 262144
max_inserts_per_ip_hour = 100
curated_dir = ""
# wasm build pipeline; the deployed toml carries the real token and
# blobs path — an empty token keeps the whole build surface disabled
build_token = ""
blobs_dir = "blobs"
# The separate origin page artifacts (user-influenced html/js) are served from.
# Empty REFUSES page builds (graphics/audio samples) rather than serving a
# user-authored document from this origin — so leaving it unset disables the
# feature, it does not loosen it. Production sets https://run.daslang.io; for
# local page testing set this server's own origin, e.g. http://127.0.0.1:8101
page_origin = ""
build_claim_timeout_seconds = 600
max_build_attempts = 3
