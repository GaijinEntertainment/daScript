id: outline-structures
language: daslang
rule:
  any:
    - kind: struct_declaration
    - kind: class_declaration
---
id: outline-functions
language: daslang
rule:
  kind: function_declaration
  not:
    inside:
      stopBy: end
      any:
        - kind: struct_declaration
        - kind: class_declaration
---
id: outline-enums
language: daslang
rule:
  kind: enumeration_declaration
---
id: outline-globals
language: daslang
rule:
  kind: global_let
---
id: outline-typedefs
language: daslang
rule:
  kind: typedef_declaration
  not:
    inside:
      stopBy: end
      any:
        - kind: struct_declaration
        - kind: class_declaration
---
id: outline-bitfields
language: daslang
rule:
  kind: bitfield_alias_declaration
---
id: outline-variants
language: daslang
rule:
  kind: variant_alias_declaration
