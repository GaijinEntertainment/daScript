<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>daslang benchmark stand</title>
<meta name="description" content="Nightly performance of the daslang interpreter and JIT over commits: every [benchmark] arm in the repository, measured on one box, plotted over time.">
<link rel="stylesheet" href="style.css">
</head>
<body class="stand-page">
<header class="top">
    <div class="top__title"><a class="top__brand" href="https://daslang.io/">daslang</a><h1>benchmark stand</h1></div>
    <div class="stand"><div class="top__status" id="status"></div></div>
</header>
<main class="stand" id="stand"></main>
<footer class="foot">

</footer>
<script src="app.js"></script>
</body>
