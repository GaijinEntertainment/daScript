<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>daslang</title>
<style>
  html, body {
    margin: 0; height: 100%; background: #0d0c0a; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  /* Letterbox, never stretch: the canvas keeps its intrinsic (game) aspect
     ratio and scales to fit. Forcing width/height:100% ALONE would distort the
     fixed-size backing store into the container shape — the "squished" look;
     object-fit is what keeps the aspect while allowing both directions.
     max-width/max-height alone only ever scale DOWN, so a 640x480 program sat
     at 640x480 in the middle of a larger frame — measured on a 906px-wide
     playground frame, which is the "renders in the middle at 2/3" report. */
  #canvas {
    width: 100%; height: 100%; object-fit: contain;
    border: 0; outline: none; display: block;
  }
</style>
</head>
<body>
<!-- Minimal canvas-only shell shipped by `daspkg release wasm`. Sites embed
     this artifact in an iframe; override with release_web_shell(<path>) for a
     custom frame. -->
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<script>
  // The app owns the keyboard: stop arrow/space/page keys from scrolling the
  // embedding page. emscripten GLFW reads them for input but does not
  // preventDefault, so their default scroll otherwise chains out of this
  // (unscrollable) iframe to the host document.
  var SCROLL_KEYS = { ArrowUp:1, ArrowDown:1, ArrowLeft:1, ArrowRight:1, ' ':1, Spacebar:1, PageUp:1, PageDown:1, Home:1, End:1 };
  window.addEventListener('keydown', function (e) {
    if (SCROLL_KEYS[e.key]) e.preventDefault();
  }, { passive: false });
  var Module = {
    canvas: (function () {
      var c = document.getElementById('canvas');
      // Keep focus on the canvas so keyboard input reaches the game.
      c.addEventListener('click', function () { c.focus(); });
      // Report the drawing buffer to an embedder the moment a program asks for
      // a GL context, so it can size its frame to the program's real aspect —
      // the same contract run-frame.html has with the playground, which is what
      // lets the canvas fill without letterboxing. Carries dimensions only, so
      // the wildcard target discloses nothing; a standalone page just posts to
      // itself and nobody listens.
      var origGetContext = c.getContext.bind(c);
      c.getContext = function (type) {
        if (/webgl/i.test(String(type))) {
          try {
            parent.postMessage({ type: 'canvas-visible', width: c.width, height: c.height }, '*');
          } catch (e) { /* embedder gone, or none */ }
        }
        return origGetContext.apply(c, arguments);
      };
      return c;
    })(),
  };

  // Feed for an embedder's fps badge (the playground's, today). Counts animation
  // frames in which the program DREW rather than raw rAF ticks — a threaded program
  // keeps rAF at display rate while presenting far fewer frames, and the whole point
  // of the badge is to show the real rate. Wildcard target like canvas-visible above:
  // it carries one number, and a standalone page just posts to itself.
  (function installFpsMeter() {
    var drew = false, frames = 0, last = performance.now();
    var DRAWS = ['drawArrays', 'drawElements', 'drawArraysInstanced', 'drawElementsInstanced', 'drawRangeElements'];
    [window.WebGLRenderingContext, window.WebGL2RenderingContext].forEach(function (ctor) {
      if (!ctor || !ctor.prototype) return;
      DRAWS.forEach(function (name) {
        var original = ctor.prototype[name];
        if (typeof original !== 'function') return;
        ctor.prototype[name] = function () { drew = true; return original.apply(this, arguments); };
      });
    });
    (function tick() {
      if (drew) { frames++; drew = false; }
      var now = performance.now();
      if (now - last >= 500) {
        try { parent.postMessage({ type: 'fps', value: frames * 1000 / (now - last) }, '*'); } catch (e) { /* no embedder */ }
        frames = 0;
        last = now;
      }
      requestAnimationFrame(tick);
    })();
  })();
</script>
{{{ SCRIPT }}}
</body>
</html>
