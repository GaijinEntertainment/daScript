<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="das-build" content="__DAS_BUILD_STAMP__">
<title>daslang</title>
<style>
  html, body {
    margin: 0; height: 100%; height: 100dvh; background: #0d0c0a; overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  /* Letterbox, never stretch: the canvas keeps its intrinsic (game) aspect
     ratio and scales to fit. Forcing width/height:100% ALONE would distort the
     fixed-size backing store into the container shape — the "squished" look;
     object-fit is what keeps the aspect while allowing both directions.
     max-width/max-height alone only ever scale DOWN, so a 640x480 program sat
     at 640x480 in the middle of a larger frame — measured on a 906px-wide
     playground frame, which is the "renders in the middle at 2/3" report. */
  /* the program owns every finger: no browser pan, pinch or double-tap zoom on the canvas */
  #canvas {
    width: 100%; height: 100%; object-fit: contain;
    border: 0; outline: none; display: block;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
</style>
</head>
<body>
<!-- Minimal canvas-only shell shipped by `daspkg release wasm`. Sites embed
     this artifact in an iframe; override with release_web_shell(<path>) for a
     custom frame. -->
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<script>
  // The app owns the keyboard: stop arrow/space/page keys from scrolling the
  // embedding page. emscripten GLFW reads them for input but does not
  // preventDefault, so their default scroll otherwise chains out of this
  // (unscrollable) iframe to the host document.
  var SCROLL_KEYS = { ArrowUp:1, ArrowDown:1, ArrowLeft:1, ArrowRight:1, ' ':1, Spacebar:1, PageUp:1, PageDown:1, Home:1, End:1 };
  window.addEventListener('keydown', function (e) {
    if (SCROLL_KEYS[e.key]) e.preventDefault();
  }, { passive: false });
  var Module = {
    canvas: (function () {
      var c = document.getElementById('canvas');
      // Keep focus on the canvas so keyboard input reaches the game.
      c.addEventListener('click', function () { c.focus(); });
      c.addEventListener('pointerdown', function () { c.focus(); });
      // Report the drawing buffer to an embedder the moment a program asks for
      // a GL context, so it can size its frame to the program's real aspect —
      // the same contract run-frame.html has with the playground, which is what
      // lets the canvas fill without letterboxing. Carries dimensions only, so
      // the wildcard target discloses nothing; a standalone page just posts to
      // itself and nobody listens.
      var origGetContext = c.getContext.bind(c);
      c.getContext = function (type) {
        if (/webgl/i.test(String(type))) {
          try {
            parent.postMessage({ type: 'canvas-visible', width: c.width, height: c.height }, '*');
          } catch (e) { /* embedder gone, or none */ }
        }
        return origGetContext.apply(c, arguments);
      };
      return c;
    })(),
  };

  // Browsers only start audio from a gesture: resume every AudioContext the program opens on the first pointer/key event.
  (function installAudioUnlock() {
    var OrigAC = window.AudioContext || window.webkitAudioContext;
    if (!OrigAC) return;
    var ctxs = new Set();
    var Wrapped = function () {
      var c = new OrigAC(...arguments);
      ctxs.add(c);
      try { c.resume().catch(function () {}); } catch (e) {}
      return c;
    };
    Wrapped.prototype = OrigAC.prototype;
    window.AudioContext = Wrapped;
    if (window.webkitAudioContext) window.webkitAudioContext = Wrapped;
    var resumeAll = function () {
      ctxs.forEach(function (c) {
        if (c.state === 'closed') ctxs.delete(c);
        else if (c.state !== 'running') c.resume().catch(function () {});   // 'suspended', and WebKit's 'interrupted'
      });
    };
    ['pointerdown', 'touchend', 'keydown', 'click'].forEach(function (e) {
      document.addEventListener(e, resumeAll, true);
    });
  })();

  // iOS mutes Web Audio under the ring/silent switch unless the tab holds a playback session, the
  // one a media element gets: ask for it through the Audio Session API where it exists, and on the
  // first gesture start a silent looping <audio> element, which puts the tab in that session too.
  (function installPlaybackSession() {
    var SILENT_WAV = 'data:audio/wav;base64,UklGRjQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YRAAAAAAAAAAAAAAAAAAAAAAAAAA';
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    var IOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    if (!IOS) return;
    var GESTURES = ['pointerdown', 'touchend', 'keydown', 'click'];
    var held = null, pending = false;
    // a gesture the browser does not count as activation (a touch's pointerdown) has its
    // play() refused; the arm stays for the next gesture and leaves once a play went through
    var arm = function () {
      if (held || pending) return;
      var a;
      try { a = new Audio(SILENT_WAV); } catch (e) { return; }
      a.loop = true;
      a.setAttribute('playsinline', '');
      pending = true;
      a.play().then(function () {
        held = a;
        GESTURES.forEach(function (e) { document.removeEventListener(e, arm, true); });
      }, function () { pending = false; });
    };
    GESTURES.forEach(function (e) { document.addEventListener(e, arm, true); });
  })();

  // Feed for an embedder's fps badge (the playground's, today). Counts animation
  // frames in which the program DREW rather than raw rAF ticks — a threaded program
  // keeps rAF at display rate while presenting far fewer frames, and the whole point
  // of the badge is to show the real rate. Wildcard target like canvas-visible above:
  // it carries one number, and a standalone page just posts to itself.
  (function installFpsMeter() {
    var drew = false, frames = 0, last = performance.now();
    var DRAWS = ['drawArrays', 'drawElements', 'drawArraysInstanced', 'drawElementsInstanced', 'drawRangeElements'];
    [window.WebGLRenderingContext, window.WebGL2RenderingContext].forEach(function (ctor) {
      if (!ctor || !ctor.prototype) return;
      DRAWS.forEach(function (name) {
        var original = ctor.prototype[name];
        if (typeof original !== 'function') return;
        ctor.prototype[name] = function () { drew = true; return original.apply(this, arguments); };
      });
    });
    (function tick() {
      if (drew) { frames++; drew = false; }
      var now = performance.now();
      if (now - last >= 500) {
        try { parent.postMessage({ type: 'fps', value: frames * 1000 / (now - last) }, '*'); } catch (e) { /* no embedder */ }
        frames = 0;
        last = now;
      }
      requestAnimationFrame(tick);
    })();
  })();
</script>
{{{ SCRIPT }}}
</body>
</html>
